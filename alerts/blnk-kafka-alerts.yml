# Prometheus alerting rules for Blnk's Kafka event-publishing pipeline. Every
# gauge referenced here is declared in internal/metrics/metrics.go and exposed on
# /metrics; Prometheus loads this file through the rule_files: stanza in
# prometheus.yml. A gauge nothing evaluates is never alerted on, and a rule whose
# series is never recorded can never fire, so both halves have to be in place.
#
# THREE rules, and the third exists because of a failure mode the first two share
# with every threshold alert: they can only fire on a number that was measured.
# Consumer lag is a sum over partitions, so a partition the broker will not report
# contributes nothing and the total silently becomes a lower bound — which would
# RESOLVE SubscriberConsumerLagHigh at exactly the moment the system is least able
# to tell whether it should fire. So an incompletely measured topic publishes no
# lag at all, and ConsumerLagMeasurementDegraded covers the gap that leaves.

groups:
  # One group: every rule covers the same domain and shares one cadence, and a
  # single self-contained block copies verbatim into the prometheus-config
  # ConfigMap the Kubernetes manifests mount.
  - name: blnk-kafka-alerts
    # Pinned rather than inherited. prometheus.yml sets only
    # global.scrape_interval (15s) and leaves global.evaluation_interval at its
    # 1 minute default, so an unpinned group would change cadence the day
    # someone adds that global. 30s is one evaluation per two scrapes.
    interval: 30s
    rules:
      # Retry-exhausted events nobody has cleared. In a financial ledger that
      # means mutations are not reaching subscribers, so this pages.
      - alert: DeadLetterMessageStuck
        # 900 is the 15 minute threshold the requirement states, as a literal so
        # it is greppable. blnk_dlt_oldest_message_age_seconds is the age of the
        # OLDEST unresolved retry-exhausted event, so one comparison covers the
        # whole inventory. That inventory is every outbox row in the
        # dead_lettered or failed state, so an event whose dead-letter write
        # itself failed is included, reported under the .dlt topic it was
        # destined for. Left bare on purpose: no label matcher, so the rule keeps
        # whatever attributes the gauge carries.
        #
        # THE TWO STATES NEED DIFFERENT ACTIONS, which is why the description
        # below is written in two branches rather than one. Only a dead_lettered
        # entry is replayable; a failed entry's dead-letter write has not
        # completed, so replay refuses it with EVENT_NOT_DEAD_LETTERED and the
        # actual fix is upstream. A single "replay it" instruction sent an
        # operator to an endpoint that would reject them, on the more urgent of
        # the two states. Splitting the SIGNAL was considered and rejected: the
        # age is one per-topic maximum, two gauges would double the series for
        # one question, and an operator has to read the entry's status to triage
        # it either way.
        expr: blnk_dlt_oldest_message_age_seconds > 900
        # Deliberately zero, not omitted: the threshold already carries the 15
        # minutes, and a dwell here would double-count it and push the first
        # notification past the boundary the requirement fixes.
        for: 0m
        labels:
          severity: critical
          component: event-streaming
        annotations:
          summary: "Dead-lettered events unresolved for more than 15 minutes"
          description: "The oldest unresolved dead-letter entry destined for {{ $labels.topic }} (instance {{ $labels.instance }}) has been waiting {{ $value | humanizeDuration }}. This value is an age, not a count: one entry this old is enough to fire. REMEDIATION IS STATUS-DEPENDENT, so read the status first with GET /events/dead-letter. A 'dead_lettered' entry is on its topic and is replayable: triage it and replay it with POST /events/dead-letter/:event_id/replay. A 'failed' entry is NOT replayable yet — its retry budget is spent but the dead-letter write itself has not completed, so there may be no message on the topic at all and replay is refused with EVENT_NOT_DEAD_LETTERED; restore broker reachability so the dead-letter write completes, then replay. GET /events/stats reports how many are in each state."
          runbook_url: docs/kafka-operations.md

      # A subscriber falling behind. The events are durably in Kafka and the
      # consumer catches up on its own, so this is degradation, not loss.
      - alert: SubscriberConsumerLagHigh
        # blnk_kafka_consumer_lag is computed in-process by differencing
        # committed offsets against log end offsets and is already summed across
        # a topic's partitions, so it is compared bare — no sum(), no
        # clamp_min() — which also keeps the subscriber, group and topic
        # attributes on the notification.
        # The series carries only COMPLETE measurements, which is what makes the
        # comparison trustworthy: a topic with unreadable partitions is withheld
        # from this gauge rather than reported at its partial sum, so this rule can
        # never be resolved by a measurement failure. The gap that withholding
        # leaves is what ConsumerLagMeasurementDegraded below covers.
        expr: blnk_kafka_consumer_lag > 10000
        # Four consecutive evaluations at the interval above. Unlike an age,
        # consumer lag is legitimately spiky, so a short dwell avoids paging on a
        # burst that self-corrects.
        for: 2m
        labels:
          severity: warning
          component: event-streaming
        annotations:
          # The subscriber and group values are PSEUDONYMS — a stable truncated SHA-256 of
          # the registry identifier — and never customer-chosen names, deliberately: an
          # annotation is rendered into notifications and incident tickets, so a
          # name-derived label would export a customer's identity into places it cannot be
          # recalled from. Even Blnk's own opaque 'sub_<uuid>' identifier is withheld,
          # because a label carries no access control and the registry is the right place
          # for the correlation capability to live. Resolve one by hashing each
          # subscriber_id the same way, or search the service logs for the matching
          # subscriber_id_hash field.
          #
          # Three collapse tokens can appear in place of a pseudonym, each meaning
          # something different, and none of them is hashed because none is anyone's name:
          # 'unattributed' — the reading came from a query that named no subscriber;
          # 'unregistered' — a value was named but is not one Blnk issued, which is itself
          # worth investigating; 'other' — the topic is not one Blnk owns. See
          # consumerLagSample in event_admin.go and the resolvers in
          # event_metrics_support.go.
          summary: "Subscriber consumer group lag is above 10,000 messages"
          description: "Subscriber {{ $labels.subscriber }} (consumer group {{ $labels.group }}) is {{ $value | humanize }} messages behind the end of topic {{ $labels.topic }}. Confirm the consumer is running and keeping up before Kafka's retention window is reached. The subscriber and group labels are PSEUDONYMS, not names: each is a truncated SHA-256 of the identifier, so a metric label never carries a subscriber name into a dashboard or a notification. They are stable, so the same subscriber always produces the same label. Resolve one by listing the registry through GET /subscribers and hashing each subscriber_id the same way, or search the service logs for the matching subscriber_id_hash field."
          runbook_url: docs/kafka-operations.md

      # AUTH-01 — a subscriber credential Blnk could not revoke.
      #
      # Provisioning writes a subscriber's SCRAM credential BEFORE its ACL
      # bindings, because a binding for a principal that does not exist is inert
      # while a credential without bindings AUTHENTICATES. A binding failure is
      # therefore compensated by revoking the credential — and when that
      # compensation also fails, a live means of authenticating to the event bus
      # exists at the broker for a principal the registry records no issuance for.
      #
      # THE AGE, NOT THE COUNT, is what this fires on. A marker cleared within a
      # minute by a retry is routine: the automatic settlement paths — re-issuing,
      # which replaces the orphan credential by construction, and deprovisioning,
      # which revokes it — are working. One outstanding for an hour means neither
      # has been exercised and a human has to revoke it. Alerting on the count
      # alone would page on every transient broker error.
      #
      # The age is measured from when the obligation was FIRST recorded and is
      # never reset by a later failed attempt, so it is the age of the EXPOSURE
      # rather than of the last try.
      - alert: SubscriberRevocationOutstanding
        expr: blnk_subscribers_oldest_revocation_age_seconds > 3600
        # Zero dwell. The gauge is already an age, so the expression itself
        # encodes the duration; a `for` would add an hour to an hour.
        for: 0m
        labels:
          severity: critical
          component: event-streaming
        annotations:
          summary: "A subscriber Kafka credential has been awaiting revocation for over an hour"
          description: "Blnk has been unable to revoke a subscriber's SASL/SCRAM credential for {{ $value | humanizeDuration }} (instance {{ $labels.instance }}), so a live credential exists at the broker for a principal no registry row records an issuance for. It is NOT attributed to a subscriber here on purpose — a subscriber label would export a tenant identifier into every notification. Find the rows with GET /subscribers and look for revocation_pending, then revoke by hand with: kafka-configs --alter --delete-config SCRAM-SHA-512 --entity-type users --entity-name <principal>. Re-issuing credentials for the subscriber, or deprovisioning it, settles the marker automatically."
          runbook_url: docs/kafka-operations.md

      # Lag that cannot be measured. This is not a lag alert: it fires when Blnk
      # cannot tell what the lag IS, which is a distinct and more urgent condition
      # because every other consumer-lag signal is unreliable while it holds.
      - alert: ConsumerLagMeasurementDegraded
        # Any non-zero value. There is no "acceptable" number of unreadable
        # partitions: one is enough to make the topic's lag a lower bound, and the
        # lag series for that topic disappears while this holds, so a threshold
        # above zero would leave a range in which lag is both unmeasured and
        # unalerted. Compared bare so the subscriber, group and topic attributes
        # reach the notification — they are the same three labels
        # blnk_kafka_consumer_lag carries, deliberately, so the two series join.
        expr: blnk_kafka_consumer_lag_unmeasured_partitions > 0
        # Longer than the lag rule's dwell. A partition is briefly unreadable during
        # ordinary cluster events — a leader election, a broker restart, a partition
        # reassignment — and those resolve without intervention well inside five
        # minutes. Paging on them would make this the noisiest rule in the file and
        # so the first one silenced, which is the opposite of the intent. Five
        # minutes is ten consecutive evaluations at the interval above, and it stays
        # comfortably inside the fifteen-minute window the dead-letter rule uses, so
        # a genuine metadata fault is still surfaced promptly.
        for: 5m
        labels:
          severity: warning
          component: event-streaming
        annotations:
          # Deliberately NOT critical, even though it degrades observability: the
          # events themselves are unaffected — they are durably in Kafka and the
          # relay is unaware of this — so nothing is being lost. What is lost is the
          # ability to see a lagging consumer, which is a warning that needs an
          # operator today rather than a page tonight.
          #
          # The subscriber and group values are opaque registry-issued identifiers
          # for the same reason they are on SubscriberConsumerLagHigh: an annotation
          # is rendered into notifications and incident tickets, so a name-derived
          # label would export a customer's identity into places it cannot be
          # recalled from.
          summary: "Consumer lag cannot be fully measured for a subscriber topic"
          description: "{{ $value }} partition(s) of topic {{ $labels.topic }} could not be read when subscriber {{ $labels.subscriber }} (consumer group {{ $labels.group }}) was last measured, so its lag is a lower bound and is WITHHELD from blnk_kafka_consumer_lag — SubscriberConsumerLagHigh cannot fire for this topic while this alert holds. Check broker and partition health first; the partial total is in the event-metrics log line. The subscriber and group values are opaque registry identifiers: resolve them through the subscriber registry."
          runbook_url: docs/kafka-operations.md
