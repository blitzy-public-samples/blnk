# The Kafka broker workload, and the manifest every Service in kafka-service.yaml
# selects. Without it those Services front nothing: a client resolves kafka:9092,
# gets no endpoint, and every publish fails with a connection error that reads
# like a network fault rather than a missing workload.
#
# WHY A StatefulSet AND NOT A Deployment. Three properties a Deployment cannot
# give, each of which Kafka needs:
#
#   * A STABLE IDENTITY. A KRaft broker's node.id and its controller-quorum
#     membership are part of the cluster's persistent metadata, and node.id is
#     written into meta.properties when storage is formatted. A pod that came
#     back with a different ordinal would present a node.id its own log directory
#     contradicts, and the broker refuses to start rather than adopt it.
#   * A STABLE ADDRESS. advertised.listeners must name the one pod that holds a
#     partition's leadership, because that is the address the metadata response
#     hands to producers. Only a StatefulSet behind a headless Service publishes
#     a per-pod DNS name.
#   * PER-POD STORAGE. Each broker owns its own log directory. A shared
#     ReadWriteOnce claim across three pods cannot be mounted by more than one
#     node, and a shared log directory would corrupt the cluster if it could.
#
# THIS IS THE PRODUCTION SHAPE, and it deliberately differs from the local
# single-broker compose stack in exactly two places. Both are commented at the
# line that makes them, so neither reads as drift:
#
#   1. DURABILITY. replicas is 3 rather than 1, every internal topic's
#      replication factor is 3 rather than 1, and min.insync.replicas is 2 rather
#      than 1. Those move together with KAFKA_REPLICATION_FACTOR: "3" in
#      blnk-config.yaml and with config.KafkaConfig's ReplicationFactor default
#      of 3. Changing one without the others produces a cluster that either
#      cannot create a topic or acknowledges a write no second broker holds.
#   2. TRANSPORT. Every SASL listener here is SASL_SSL, where compose uses
#      SASL_PLAINTEXT. SCRAM authenticates a client but does not encrypt the
#      channel, and these topics carry ledger amounts plus the names, addresses
#      and dates of birth on identity events. Plaintext is acceptable for a
#      single-broker stack on a developer's loopback interface and nowhere else.
#
# Everything else about the broker — the listener names, the mechanism, the
# authorizer, super.users, allow.everyone.if.no.acl.found, the partition default
# and auto.create.topics.enable — is deliberately IDENTICAL to the compose
# broker, so a behaviour verified locally is the behaviour in production.
#
# TWO SECRETS MUST EXIST BEFORE THIS APPLIES, and neither is committed to this
# folder — the same rule blnk-config.yaml states for KAFKA_SASL_ADMIN_SECRET:
#
#   kafka-credentials   key `admin-secret`: the SCRAM password of the principal
#                       named by the KAFKA_SASL_ADMIN_USER key of blnk-config.
#                       The broker's storage is formatted with it, the broker's
#                       own inter-broker and controller logins present it, and
#                       Blnk's provisioning path authenticates with it. One
#                       value in three places, so it lives in one Secret.
#
#                       key `producer-secret`: the SCRAM password of the
#                       principal named by KAFKA_SASL_USER, which the server and
#                       worker publish with. A SEPARATE value from admin-secret,
#                       and it must stay separate: config.ProducerSASL refuses to
#                       let a publisher authenticate as the administrator, so
#                       reusing one password here would not merely be weak, it
#                       would be a configuration Blnk declines to start with.
#                       The brokers themselves never read this key; the principal
#                       is created against the running cluster by
#                       scripts/kafka-provision.sh.
#
#   kafka-tls           keys `keystore.jks`, `truststore.jks`,
#                       `keystore-password`, `truststore-password`, `key-password`
#                       and `ca.crt`.
#
#                       THE CERTIFICATE'S SANs ARE PART OF THIS CONTRACT, not a
#                       detail. ssl.endpoint.identification.algorithm is https
#                       below, so every connection verifies the broker's
#                       certificate against the hostname it dialled. The
#                       keystore must therefore carry, as subject alternative
#                       names, each per-pod name
#                       kafka-<0..2>.kafka-headless.blnk.svc.cluster.local — used
#                       by inter-broker traffic, by Blnk, and by this pod's own
#                       readiness probe — plus the Service names `kafka` and
#                       `kafka-headless`, plus any external address advertised on
#                       the EXTERNAL listener. A certificate missing a SAN
#                       produces a handshake failure at every one of those
#                       points, and the pod simply never becomes Ready.
#
#                       `ca.crt` IS THE SAME AUTHORITY AS truststore.jks, in the
#                       other representation. The brokers read a Java keystore;
#                       Blnk is Go and crypto/x509 reads PEM, so both forms of
#                       one CA live in this Secret and KAFKA_TLS_CA_FILE in
#                       blnk-config.yaml points at the PEM. Two different CAs
#                       produce a broker and a client that are each internally
#                       consistent and cannot talk to each other.
#
#                       The app Deployments project `ca.crt` ALONE from this
#                       Secret. They have no use for the keystore, and mounting
#                       it would put the brokers' private key inside the
#                       most network-exposed process in the deployment.
#
# Create them, in the blnk namespace, before applying this file.
#
# NOTHING BELOW PUTS A CREDENTIAL ON A COMMAND LINE, and that is the point rather
# than fastidiousness. `--from-literal=admin-secret=<value>` places the secret in
# kubectl's argv, and argv is readable for the life of the process through
# /proc/<pid>/cmdline by anything in the same namespace — a monitoring agent, an
# audit tool, a container-metrics collector — and is captured verbatim by shell
# history and by CI job logs. That is how a production broker credential ends up in
# a log nobody meant to write, and it cannot be redacted afterwards.
# `--from-file` reads the bytes from a path instead, so only the PATH is in argv.
#
#   umask 077                     # every file below is created 0600
#   mkdir -p ./kafka-secrets && cd ./kafka-secrets
#
#   # 32 alphanumerics. The alphabet and the length are not arbitrary: the init
#   # container below refuses anything shorter than 32, anything with fewer than 16
#   # distinct characters, and anything outside the alphabet that is safe to
#   # interpolate into the SCRAM argument, the properties file and the JAAS login it
#   # writes. This recipe is the one scripts/kafka-bootstrap.sh recommends, and it
#   # satisfies all three checks by construction.
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > admin-secret
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > producer-secret
#
#   umask 077
#   openssl rand -base64 24 > admin-secret
#   openssl rand -base64 24 > producer-secret
#   kubectl -n blnk create secret generic kafka-credentials \
#     --from-file=admin-secret=./admin-secret \
#     --from-file=producer-secret=./producer-secret
#
#   # The keystore passwords are secrets too, so they are files as well.
#   printf '%s' "$KEYSTORE_PASSWORD"   > keystore-password
#   printf '%s' "$TRUSTSTORE_PASSWORD" > truststore-password
#   printf '%s' "$KEY_PASSWORD"        > key-password
#
#   # The TLS material. The three passwords are written to files by whatever created
#   # the stores (keytool -storepass reads a file with :file, and openssl reads
#   # -passout file:...), so they are handed over the same way.
#   kubectl -n blnk create secret generic kafka-tls \
#     --from-file=keystore.jks=../kafka.keystore.jks \
#     --from-file=truststore.jks=../kafka.truststore.jks \
#     --from-file=ca.crt=../ca.crt \
#     --from-file=keystore-password=./keystore-password \
#     --from-file=truststore-password=./truststore-password \
#     --from-file=key-password=./key-password
#
#   cd .. && rm -rf ./kafka-secrets     # or keep it in a secret manager, never in git
#
# WHY --from-file AND NOT --from-literal. A --from-literal value is a COMMAND
# ARGUMENT. Arguments are world-readable in /proc/<pid>/cmdline for the lifetime of
# the process, they are recorded verbatim by the shell's history file, and they are
# captured by process-accounting, eBPF and audit tooling, and by any container
# runtime or CI system that logs the command it ran. `--from-literal=admin-secret=
# "$(openssl rand -base64 24)"` is worse still: the substitution happens in the
# shell, so the generated superuser password is the argument. None of that is
# recoverable after the fact, and the value in question is the KRaft cluster's
# permanent superuser credential — the one secret in this deployment that cannot be
# rotated without destroying every volume. A file passes through the filesystem
# under umask 077 and is read by kubectl alone.
#
# A secret manager (External Secrets, Vault Agent, a CSI secret driver) is the
# better answer where one exists, and it is the same principle: the value is
# delivered as a file or through an API, never as an argument.
#
# A missing Secret leaves the broker pods waiting rather than starting an
# unauthenticated or unencrypted broker, which is the correct failure: an event
# stream carrying ledger mutations must not come up open. An absent kafka-tls
# holds them in ContainerCreating with an event naming the Secret; an empty
# KAFKA_SASL_ADMIN_USER makes the init container exit 1 with the reason on
# stderr, before any broker process exists. The same init container also refuses
# an administrative principal whose name would break the configuration it is
# written into, a password outside the safe alphabet or below the 32-character
# and 16-distinct-character floors, and a KAFKA_CLUSTER_ID that is not a
# base64url-encoded 16-byte UUID — every one of them BEFORE the metadata log is
# formatted, because each is written into that log permanently and correcting one
# afterwards means destroying every volume in the set.
#
# WHAT THAT MEANS FOR `kubectl apply -f k8s-manifests/`. Applying the folder
# without those Secrets leaves THESE pods not running and every other workload
# healthy — Blnk included, because blnk-config.yaml ships KAFKA_BROKERS empty and
# the event publisher then resolves to its no-op implementation. So a deployment
# that has not adopted Kafka is not broken by this file; it has a broker workload
# it is not using yet. Adopt Kafka in one change: create both Secrets, fill in
# KAFKA_BROKERS, KAFKA_SASL_USER, KAFKA_SASL_ADMIN_USER and
# WEBHOOK_DEPRECATION_SUNSET_DATE in blnk-config.yaml, and once the brokers are
# Ready run scripts/kafka-provision.sh against them to create the topic
# catalogue, the producer principal and its Write/Describe grants.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
  name: kafka
  namespace: blnk
spec:
  # DIVERGENCE 1 OF 2 FROM COMPOSE, and the one with a late failure mode. Three
  # brokers, because KAFKA_REPLICATION_FACTOR is 3 in blnk-config.yaml and
  # config.KafkaConfig defaults ReplicationFactor to 3. A topic cannot be created
  # with a replication factor above the broker count — the controller answers
  # INVALID_REPLICATION_FACTOR — and NOTHING HERE CATCHES THAT AT APPLY TIME. The
  # manifest applies cleanly, the pods go Ready, and the first failure appears
  # later inside event_admin.go's topic assurance.
  #
  # Three is also the smallest count that gives the KRaft quorum a majority (2 of
  # 3) able to elect a leader and commit metadata while one node is down, so it is
  # what makes min.insync.replicas=2 survivable rather than an outage waiting for
  # a single restart.
  #
  # SCALING THIS NUMBER IS A THREE-PLACE CHANGE: this value, the voter list in the
  # init container below, and one kafka-external-<ordinal> Service per replica in
  # kafka-service.yaml. Scaling DOWN below 3 additionally requires lowering
  # KAFKA_REPLICATION_FACTOR, min.insync.replicas and the internal-topic factors,
  # or topic creation starts failing.
  replicas: 3
  selector:
    matchLabels:
      io.kompose.service: kafka
  # MUST be the headless Service, not the client-facing one. See the long note in
  # kafka-service.yaml: per-pod DNS records exist only for the headless Service a
  # StatefulSet names here, and the quorum voters, every advertised listener and
  # the readiness probe's bootstrap address are all per-pod names. That Service
  # also sets publishNotReadyAddresses, which is what lets a pod resolve its own
  # name before it is Ready — without it the readiness probe below could never
  # succeed, because the name it dials would not exist until it had.
  serviceName: kafka-headless
  # PARALLEL IS REQUIRED HERE, NOT PREFERRED. OrderedReady deadlocks this cluster
  # permanently on a clean install, and it is worth being precise about why,
  # because the mechanism is entirely in the interaction of three settings that
  # are individually correct.
  #
  # Every pod runs process.roles=broker,controller and controller.quorum.voters
  # names all three, so all three are KRaft VOTERS. A Raft quorum commits nothing
  # until a MAJORITY is reachable — 2 of 3 — so with one pod running there is no
  # elected metadata leader and no metadata to serve. The readiness probe below is
  # an authenticated `kafka-topics.sh --list`, which needs exactly that leader, so
  # broker 0 alone can never become Ready.
  #
  # OrderedReady is defined as "do not create pod N+1 until pod N is Ready". So the
  # StatefulSet controller waits for a readiness condition that cannot be satisfied
  # until it creates the peers it is refusing to create. kafka-1 and kafka-2 are
  # never scheduled, and the cluster never starts. Not slow — stopped, with a single
  # pod looping its probes and nothing in the events to say what it is waiting for.
  # The startupProbe's own comment below already describes the correct behaviour,
  # "on a cold cluster the first broker waits for peers that are still being
  # scheduled", which is true under Parallel and impossible under OrderedReady.
  #
  # The previous justification for ordering does not survive inspection either.
  # "All three format storage simultaneously" is not contention: each pod formats
  # its OWN volume from volumeClaimTemplates, with --ignore-formatted making the
  # operation idempotent per pod. "Contest quorum election simultaneously" is what
  # a leader election IS, and Raft is specified to resolve it. What was described
  # as a readable log sequence costing a minute was in fact an unbootstrappable
  # cluster.
  #
  # The alternative fix is to split controller and broker into separate workloads
  # so the voters form a quorum before any broker's readiness gates a rollout. That
  # is the right shape for a large cluster and a heavier change than this
  # deployment needs: with combined roles, starting the voters together is
  # sufficient and matches how every KRaft quorum is expected to boot.
  #
  # Rolling UPDATES are unaffected by this setting — updateStrategy governs those,
  # and it remains ordered, so a rollout still replaces one pod at a time and still
  # waits for each to be Ready before the next. Parallel changes only creation and
  # deletion, which is exactly where the deadlock was.
  podManagementPolicy: Parallel
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: kafka
    spec:
      # WHO THE BROKER RUNS AS, AND WHY THE FILES IT NEEDS ARE READABLE.
      #
      # Without this block the pod had no security context at all, and two things
      # it depends on were broken rather than merely unhardened:
      #
      #   - THE DATA VOLUME. A freshly provisioned PersistentVolume is root-owned.
      #     The Kafka image runs as an unprivileged user, so the broker could not
      #     create its log directory under the mount - and the failure surfaces as
      #     a broker that formats storage, cannot write, and exits.
      #   - THE TLS MATERIAL. Secret volumes are root-owned, and the keystore below
      #     is projected 0440. Owner-only or owner-plus-group modes are unreadable
      #     to a non-root process unless the group is one the process belongs to.
      #
      # fsGroup fixes both at once, and it is the mechanism rather than a hint:
      # Kubernetes sets group ownership of volume contents to fsGroup and adds it to
      # the container's supplementary groups, so a 0440 secret and a group-writable
      # data volume both become reachable to exactly this pod and nothing else.
      #
      # OnRootMismatch rather than the default Always, because the default
      # recursively chowns the ENTIRE volume on every mount. On a broker whose log
      # directory holds hundreds of thousands of segment files that turns each
      # restart into a multi-minute chown, and it is pure waste after the first
      # mount: OnRootMismatch checks the top-level directory and skips the walk when
      # the ownership is already right.
      #
      # 1000:1000 matches the uid and gid the Kafka image ships with, and is the uid the
      # image's own appuser has, so the PVC contents and the pre-existing log directory
      # keep their ownership across an upgrade. If a different image is substituted,
      # these two numbers and the image must be changed together - a mismatch
      # reintroduces exactly the unreadable-volume failure this block exists to prevent.
      #
      # It is also what makes the projected TLS material readable: fsGroup matching the
      # runtime uid is why the broker can read its own private key, and without it
      # initialisation fails with both listeners unbound rather than with a permission
      # error anybody would recognise. 1000/1000 rather than the 10001 the Blnk
      # workloads use, for the ownership reason above.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # The baseline profile every current Kubernetes supports, filtering the
        # syscalls a JVM has no use for. Unconfined is the default when this is
        # omitted, which is what it was.
        seccompProfile:
          type: RuntimeDefault
      # The broker calls no Kubernetes API — its peers come from the static KRaft voter
      # list, not from discovery — so a projected API token is a namespace-scoped
      # credential mounted into the process that terminates every subscriber's SASL
      # connection, for no capability it uses. Off.
      automountServiceAccountToken: false
      # Long enough for a broker to flush and leave the ISR cleanly. The default
      # 30s can cut a shutdown short mid-flush, which costs an unclean-shutdown
      # log recovery on the next start.
      terminationGracePeriodSeconds: 120
      # NO TWO BROKERS ON ONE NODE, ENFORCED RATHER THAN PREFERRED.
      #
      # This was ScheduleAnyway, described as "a durability preference this manifest
      # cannot enforce". It could, and the preference was worth nothing without it:
      # three replicas on one node is three replicas of NOTHING. Every internal topic
      # here is replication factor 3 with min.insync.replicas=2, so co-located pods
      # satisfy the ISR requirement with copies that die together, and losing that one
      # node loses the data AND the entire controller quorum at the same instant. The
      # cluster reports itself healthy right up to the moment it is gone.
      #
      # requiredDuringSchedulingIgnoredDuringExecution is the hard form, and hostname
      # anti-affinity is stricter than a spread constraint: maxSkew 1 across two nodes
      # still permits two pods on one of them, whereas this permits none.
      #
      # THE COST, STATED PLAINLY: the broker count can no longer exceed the node
      # count. A third replica on a two-node cluster stays Pending with a scheduler
      # event naming the anti-affinity, instead of quietly co-locating. That is the
      # correct outcome — a single-node cluster could never honour this manifest's
      # replication factor of 3 anyway (topic creation answers
      # INVALID_REPLICATION_FACTOR below three brokers, as the note on `replicas`
      # above sets out), so ScheduleAnyway was only ever protecting a configuration
      # that was already broken, and hiding the reason.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.kompose.service: kafka
      # Kept alongside the anti-affinity and flipped to DoNotSchedule so the two
      # agree: a spread constraint that tolerated what the anti-affinity forbids
      # would be a rule the scheduler reports as satisfied while placement is
      # rejected for another reason, which is a confusing way to learn about it.
      # hostname is the key both use because every node carries it — a zone-keyed
      # DoNotSchedule constraint makes pods unschedulable on clusters whose nodes are
      # unlabelled, which is a failure this manifest must not introduce.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              io.kompose.service: kafka
      # THE KRaft SASL BOOTSTRAP, and the reason this folder's first init
      # container exists.
      #
      # In KRaft there is no ZooKeeper to hold SCRAM credentials: they live in the
      # metadata log, and AT LEAST ONE MUST ALREADY BE THERE BEFORE ANY BROKER CAN
      # AUTHENTICATE ANYONE. That is a genuine chicken-and-egg, not an ordering
      # preference — `kafka-configs --alter --add-config 'SCRAM-SHA-512=[...]'`
      # cannot solve it, because that tool has to authenticate to the broker to
      # write the credential it needs in order to authenticate. The only way in is
      # to seed the credential while the log is being created, which is what
      # `kafka-storage format --add-scram` does and why it runs here, before the
      # broker container is started rather than beside it.
      #
      # It also generates the broker's configuration, and that is deliberate
      # rather than incidental: the format step and the running broker MUST agree
      # on node.id and log.dirs or the broker rejects its own storage, so they
      # read one generated file instead of two hand-kept copies of the same
      # values. Generating it at all — rather than projecting a ConfigMap — is
      # forced by the content: three values are per-pod (node.id and both
      # advertised listeners) and three are secret (the inter-broker, controller
      # and probe logins). A ConfigMap can hold neither kind.
      initContainers:
        - command:
            - /bin/bash
            - -c
            # WHY NO CREDENTIAL REACHES A COMMAND LINE OR A LOG. umask 077 comes
            # before anything is written, so every generated file is private from
            # creation rather than chmod'ed afterwards; the storage format reads
            # --add-scram from an argument file rather than from argv, which is
            # the same remedy scripts/kafka-bootstrap.sh applies and is verified
            # to be honoured on apache/kafka 3.9; the argument file is removed the
            # moment the command that consumed it returns; and nothing below
            # echoes a secret, so `kubectl logs -c kafka-bootstrap` is safe to
            # paste into an issue.
            #
            # $$ escapes are absent on purpose: this is a Kubernetes manifest, so
            # nothing pre-substitutes ${...} the way Compose interpolation does.
            # Every expansion below is the container shell's own.
            - |
              set -euo pipefail
              umask 077

              if [ -z "${KAFKA_SASL_ADMIN_USER}" ] || [ -z "${KAFKA_SASL_ADMIN_SECRET}" ]; then
                echo "kafka-bootstrap: KAFKA_SASL_ADMIN_USER (blnk-config) and the" >&2
                echo "kafka-bootstrap: kafka-credentials admin-secret must BOTH be set." >&2
                echo "kafka-bootstrap: Refusing to seed a metadata log with no administrative" >&2
                echo "kafka-bootstrap: principal: the broker would authenticate nobody, and" >&2
                echo "kafka-bootstrap: Blnk's topic assurance and credential issuance would" >&2
                echo "kafka-bootstrap: both fail against it. Failing here rather than later is" >&2
                echo "kafka-bootstrap: the point — an unformatted volume can still be fixed by" >&2
                echo "kafka-bootstrap: setting the values, whereas a log formatted with the" >&2
                echo "kafka-bootstrap: wrong credential has to be destroyed to correct it." >&2
                exit 1
              fi

              # NON-EMPTY IS NOT ENOUGH, and this is the one place in the deployment
              # where that gap is unrecoverable. What is validated here is written into
              # the KRaft METADATA LOG by the format below, as the cluster's
              # SUPERUSER — super.users names this principal — and a credential in a
              # metadata log cannot be corrected by editing a manifest. Correcting it
              # means destroying every volume in the StatefulSet and re-formatting,
              # which on a cluster carrying ledger events is an outage plus a data
              # restore. So the checks that would elsewhere be defence in depth are
              # here the ONLY chance to get it right, and they run before a single
              # byte is written.
              #
              # scripts/kafka-bootstrap.sh applies the same three rules to the same
              # two values for the compose broker. They are kept in step deliberately:
              # a credential the local stack accepts and production rejects, or the
              # reverse, is a difference that only shows up during a deployment.
              #
              # RULE 1 — PRINCIPAL GRAMMAR. The username is interpolated into a JAAS
              # configuration line as username="...", into super.users as
              # User:<name>, and into the --add-scram argument as name=<name> inside a
              # comma-separated bracketed list. Each of those has a character that
              # terminates it early: a double quote closes the JAAS value, a backslash
              # escapes within it, an equals sign or a comma splits the SCRAM
              # descriptor, a semicolon ends the JAAS statement, and whitespace or a
              # newline splits super.users. A name containing any of them does not
              # fail — it produces a DIFFERENT, syntactically valid configuration
              # naming a principal nobody intended, and the broker seeds that one. The
              # allowed set is therefore stated positively: letters, digits, and the
              # three separators Kafka principals conventionally use.
              case "${KAFKA_SASL_ADMIN_USER}" in
                *[!A-Za-z0-9._-]* | "" )
                  echo "kafka-bootstrap: KAFKA_SASL_ADMIN_USER contains a character that would" >&2
                  echo "kafka-bootstrap: break the configuration it is written into. Use only" >&2
                  echo "kafka-bootstrap: letters, digits, '.', '_' and '-'." >&2
                  echo "kafka-bootstrap: A quote, backslash, '=', ',', ';' or any whitespace" >&2
                  echo "kafka-bootstrap: does not fail here — it silently changes which" >&2
                  echo "kafka-bootstrap: principal the JAAS login, super.users and the SCRAM" >&2
                  echo "kafka-bootstrap: descriptor name, and that principal is seeded into" >&2
                  echo "kafka-bootstrap: the metadata log as the cluster superuser." >&2
                  exit 1
                  ;;
              esac

              # RULE 2 — PASSWORD ALPHABET. The same interpolation hazard, for the
              # same three destinations. base64 output is deliberately admitted
              # (A-Za-z0-9+/=) EXCEPT for '=' — so the header below instructs
              # `openssl rand -base64 48 | tr -d '=+/'` rather than raw base64, and
              # this check is what makes an operator who skipped that step fail here
              # instead of seeding a truncated password.
              case "${KAFKA_SASL_ADMIN_SECRET}" in
                *[!A-Za-z0-9._~+/-]* )
                  echo "kafka-bootstrap: the kafka-credentials admin-secret contains a character" >&2
                  echo "kafka-bootstrap: that would break the JAAS or SCRAM descriptor it is" >&2
                  echo "kafka-bootstrap: written into. Use only letters, digits and '. _ ~ + / -'." >&2
                  echo "kafka-bootstrap: An '=', a quote, a comma, a semicolon, a backslash or" >&2
                  echo "kafka-bootstrap: whitespace would truncate or re-point the credential" >&2
                  echo "kafka-bootstrap: rather than be rejected by the broker." >&2
                  echo "kafka-bootstrap: Generate one with:" >&2
                  echo "kafka-bootstrap:   openssl rand -base64 48 | tr -d '=+/' | cut -c1-48" >&2
                  exit 1
                  ;;
              esac

              # RULE 3 — STRENGTH FLOOR. This principal is the cluster superuser and
              # its password is seeded permanently, so a weak one is a permanent
              # weakness. Thirty-two characters is the floor, and sixteen DISTINCT
              # characters is the second half of it: length alone admits a 32-character
              # run of one letter, which satisfies a length check and no attacker.
              # Both are counted, not estimated.
              SECRET_LENGTH="${#KAFKA_SASL_ADMIN_SECRET}"
              if [ "${SECRET_LENGTH}" -lt 32 ]; then
                echo "kafka-bootstrap: the kafka-credentials admin-secret is ${SECRET_LENGTH} characters." >&2
                echo "kafka-bootstrap: At least 32 are required. This is the KRaft cluster's" >&2
                echo "kafka-bootstrap: superuser password, it is seeded into the metadata log" >&2
                echo "kafka-bootstrap: permanently, and it authenticates every inter-broker and" >&2
                echo "kafka-bootstrap: controller connection as well as Blnk's provisioning path." >&2
                echo "kafka-bootstrap: Rotating it later means re-formatting every volume." >&2
                exit 1
              fi

              # Distinct-character count without external tools: fold to one character
              # per line, sort -u, count. grep -o is avoided because the pattern would
              # have to be a character class this check cannot enumerate safely.
              SECRET_DISTINCT="$(printf '%s' "${KAFKA_SASL_ADMIN_SECRET}" \
                | fold -w1 | sort -u | wc -l | tr -d ' ')"
              if [ "${SECRET_DISTINCT}" -lt 16 ]; then
                echo "kafka-bootstrap: the kafka-credentials admin-secret uses only" >&2
                echo "kafka-bootstrap: ${SECRET_DISTINCT} distinct characters; at least 16 are required." >&2
                echo "kafka-bootstrap: A long run of a few characters passes a length check and" >&2
                echo "kafka-bootstrap: no attacker. Generate one with:" >&2
                echo "kafka-bootstrap:   openssl rand -base64 48 | tr -d '=+/' | cut -c1-48" >&2
                exit 1
              fi
              unset SECRET_LENGTH SECRET_DISTINCT

              CONF_DIR=/tmp/blnk-kafka
              LOG_DIRS=/var/lib/kafka/data
              mkdir -p "${CONF_DIR}"

              # node.id from the pod ordinal, which a StatefulSet guarantees is
              # stable across restarts and unique across the set. It is written
              # into meta.properties by the format below and re-read by the
              # broker, so the two must derive it the same way — which they do,
              # because there is only one derivation and one file.
              NODE_ID="${POD_NAME##*-}"
              POD_FQDN="${POD_NAME}.kafka-headless.${POD_NAMESPACE}.svc.cluster.local"

              # Every replica, named explicitly. A KRaft voter list is static
              # configuration: it cannot be discovered, and it must be identical
              # on all three brokers. Raising `replicas` above means extending
              # this list in the same change.
              VOTERS="0@kafka-0.kafka-headless.${POD_NAMESPACE}.svc.cluster.local:9093"
              VOTERS="${VOTERS},1@kafka-1.kafka-headless.${POD_NAMESPACE}.svc.cluster.local:9093"
              VOTERS="${VOTERS},2@kafka-2.kafka-headless.${POD_NAMESPACE}.svc.cluster.local:9093"

              # THE EXTERNAL LISTENER IS OPT-IN, because its address is the one
              # value this repository cannot know. kafka-service.yaml provisions a
              # LoadBalancer per broker on 29092 and says so explicitly: the
              # address each one receives is assigned by the cloud provider at
              # apply time. So the operator supplies them, in ordinal order, as
              # KAFKA_EXTERNAL_ADVERTISED_HOSTS on the blnk-config ConfigMap:
              #
              #   KAFKA_EXTERNAL_ADVERTISED_HOSTS: "a.example.com,b.example.com,c.example.com"
              #
              # and the same three addresses, with :29092, go into
              # KAFKA_SUBSCRIBER_BROKERS so issued credentials name a reachable
              # endpoint. Until then the listener is OMITTED ENTIRELY rather than
              # bound-but-unadvertised: a listener a client can connect to but
              # never learns about from a metadata response is worse than absent,
              # because the connection succeeds and the subsequent produce fails.
              EXTERNAL_LISTENER=""
              EXTERNAL_ADVERTISED=""
              EXTERNAL_PROTOCOL_MAP=""
              EXTERNAL_MECHANISMS=""
              if [ -n "${KAFKA_EXTERNAL_ADVERTISED_HOSTS:-}" ]; then
                IFS=',' read -r -a EXTERNAL_HOSTS <<<"${KAFKA_EXTERNAL_ADVERTISED_HOSTS}"
                EXTERNAL_HOST="${EXTERNAL_HOSTS[${NODE_ID}]:-}"
                if [ -z "${EXTERNAL_HOST}" ]; then
                  echo "kafka-bootstrap: KAFKA_EXTERNAL_ADVERTISED_HOSTS has no entry at index ${NODE_ID}," >&2
                  echo "kafka-bootstrap: so broker ${NODE_ID} has no external address to advertise. It needs" >&2
                  echo "kafka-bootstrap: ONE COMMA-SEPARATED ENTRY PER REPLICA, in ordinal order, matching" >&2
                  echo "kafka-bootstrap: the kafka-external-<ordinal> Services in kafka-service.yaml." >&2
                  echo "kafka-bootstrap: Unset it to run with the in-cluster listener only." >&2
                  exit 1
                fi
                EXTERNAL_LISTENER=",EXTERNAL://:29092"
                EXTERNAL_ADVERTISED=",EXTERNAL://${EXTERNAL_HOST}:29092"
                EXTERNAL_PROTOCOL_MAP=",EXTERNAL:SASL_SSL"
                EXTERNAL_MECHANISMS="yes"
              fi

              # COMBINED ROLES, AND WHAT THAT COSTS YOU AT SCALE.
              #
              # Each pod is both a broker and a controller. KRaft supports this and it
              # is the right shape for a three-node cluster: three combined nodes give
              # a quorum that tolerates one loss, with no second workload to operate.
              #
              # It couples two failure domains, though, and the coupling gets worse as
              # the cluster grows. Broker work — page-cache pressure, log compaction,
              # replication fetches, the GC pauses those produce — happens in the same
              # JVM that has to answer controller heartbeats, so a broker under load
              # can cost the quorum its leader. Every broker restart is also a
              # controller restart.
              #
              # The hard failure mode that made this urgent is fixed elsewhere: the
              # required pod anti-affinity above means the three combined nodes can no
              # longer land on one machine, so a single node loss can no longer take
              # both the data and the whole quorum at once.
              #
              # DEDICATED CONTROLLERS ARE THE RIGHT MOVE ABOVE ROUGHLY FIVE BROKERS,
              # and they are a topology change rather than a flag: a second
              # StatefulSet with process.roles=controller and its own storage, a
              # second headless Service, controller.quorum.voters on BOTH sets naming
              # the controller pods, and process.roles=broker here with the CONTROLLER
              # listener no longer bound. Do it as its own change, against a
              # multi-node cluster, and verify quorum formation before moving traffic
              # — a half-applied split forms no quorum at all, which is a worse
              # outcome than the coupling it removes.
              cat >"${CONF_DIR}/server.properties" <<PROPERTIES
              process.roles=broker,controller
              node.id=${NODE_ID}
              controller.quorum.voters=${VOTERS}

              listeners=BROKER://:9092${EXTERNAL_LISTENER},CONTROLLER://:9093
              advertised.listeners=BROKER://${POD_FQDN}:9092${EXTERNAL_ADVERTISED}
              listener.security.protocol.map=BROKER:SASL_SSL${EXTERNAL_PROTOCOL_MAP},CONTROLLER:SASL_SSL
              inter.broker.listener.name=BROKER
              controller.listener.names=CONTROLLER

              ssl.keystore.location=/etc/kafka/tls/keystore.jks
              ssl.keystore.password=${KAFKA_TLS_KEYSTORE_PASSWORD}
              ssl.key.password=${KAFKA_TLS_KEY_PASSWORD}
              ssl.truststore.location=/etc/kafka/tls/truststore.jks
              ssl.truststore.password=${KAFKA_TLS_TRUSTSTORE_PASSWORD}
              ssl.endpoint.identification.algorithm=https

              sasl.enabled.mechanisms=SCRAM-SHA-512
              sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
              listener.name.broker.sasl.enabled.mechanisms=SCRAM-SHA-512
              listener.name.broker.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_ADMIN_USER}" password="${KAFKA_SASL_ADMIN_SECRET}";

              sasl.mechanism.controller.protocol=PLAIN
              listener.name.controller.sasl.enabled.mechanisms=PLAIN
              listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_ADMIN_USER}" password="${KAFKA_SASL_ADMIN_SECRET}" user_${KAFKA_SASL_ADMIN_USER}="${KAFKA_SASL_ADMIN_SECRET}";

              authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
              super.users=User:${KAFKA_SASL_ADMIN_USER}
              allow.everyone.if.no.acl.found=false

              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2

              log.dirs=${LOG_DIRS}
              num.partitions=${KAFKA_MIN_PARTITIONS}
              auto.create.topics.enable=false

              # RETENTION, STATED RATHER THAN INHERITED (PERF-P24). Without
              # these three lines the broker took its defaults — retention 168
              # hours and log.retention.bytes=-1, meaning NO SIZE LIMIT —
              # against a fixed-size PersistentVolume. The failure that
              # produces is a full disk, and a Kafka broker with a full log
              # directory does not shed old data to make room: it marks the
              # directory offline and stops serving the partitions on it.
              # Losing records to retention is routine; losing a broker to a
              # full volume is an outage, and with min.insync.replicas=2
              # losing two that way stops every acks=all produce in the
              # cluster.
              #
              # THE ARITHMETIC, because these numbers are derived rather
              # than chosen:
              #
              #   5 topics + 5 .dlt siblings = 10 topics
              #   x KAFKA_MIN_PARTITIONS (6)  = 60 partitions
              #   RF 3 over 3 brokers         => EVERY broker holds all 60
              #
              # log.retention.bytes is PER PARTITION, which is the subtlety that
              # makes an eyeballed value wrong by two orders of magnitude. The
              # volumeClaimTemplate below is 200Gi; targeting 60% of it for log
              # data leaves headroom for segment rolls, index files and the
              # cushion a broker needs to compact and delete rather than wedge:
              #
              #   0.60 x 200 GiB / 60 partitions = 2 GiB per partition
              #   worst case on disk: 60 x 2 GiB = 120 GiB, 60% of the volume
              #
              # SCALING ANY OF THOSE INPUTS CHANGES THIS VALUE. More topics,
              # more partitions, more brokers than the replication factor, or
              # a differently sized volume all move it, and the direction that
              # hurts is a larger denominator with the same per-partition
              # budget. Recompute rather than assume.
              #
              # For scale: at a typical 2 KiB event, 500 events/second is
              # about 3.4 GiB an hour per broker, so 120 GiB is roughly 35
              # hours of sustained peak. At the 768 KiB ceiling
              # model.MaxEventMessageBytes allows it is minutes — which is the
              # point. NO plausible volume survives sustained worst-case
              # traffic, so the bound must be on BYTES rather than only on
              # time, or the volume decides when the broker dies.
              log.retention.bytes=2147483648
              # The TIME bound as well, and both apply: a segment is deleted
              # when EITHER limit is reached. This is Kafka's own default
              # value, written out so it is visible and reviewable rather than
              # inherited.
              #
              # It must stay LONGER than RELAY_EVENT_RETENTION_DAYS in
              # blnk-config.yaml. The daily outbox-versus-offset
              # reconciliation compares outbox rows against broker offsets,
              # and it can only do that over a window both sides still hold —
              # so purging outbox rows before the records expire keeps the two
              # ageing together, while the reverse leaves rows with no records
              # to reconcile against. Retention ships disabled (0 days), so
              # nothing is currently in tension; raising it above 7 days
              # requires raising this in the same change.
              log.retention.hours=168
              # SEGMENT SIZE IS WHAT MAKES RETENTION ACTUALLY DELETE. Kafka
              # deletes whole CLOSED segments and never the active one, so the
              # effective floor on a partition's size is one segment. At the 1
              # GiB default against a 2 GiB per-partition budget a partition
              # holds only one or two segments, and deletion becomes an
              # all-or-nothing step that can discard half the retained window
              # at once.
              #
              # 256 MiB gives eight segments per budget, so retention removes
              # the oldest eighth rather than the oldest half. At a typical 2
              # KiB event that is about 131,000 events per segment; even at
              # the 768 KiB ceiling it is around 340, so a segment still
              # closes promptly enough for retention to act on it.
              log.segment.bytes=268435456
              PROPERTIES

              # The subscriber-facing listener accepts SCRAM but never initiates
              # it: the broker only ever validates an incoming client on
              # EXTERNAL, so its JAAS entry carries no username or password. The
              # bare `required;` form is exactly what the compose broker uses,
              # and omitting the entry altogether would leave the listener with
              # no SCRAM server configuration at all.
              if [ -n "${EXTERNAL_MECHANISMS}" ]; then
                cat >>"${CONF_DIR}/server.properties" <<'PROPERTIES'
              listener.name.external.sasl.enabled.mechanisms=SCRAM-SHA-512
              listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
              PROPERTIES
              fi

              # The client properties the readiness probe authenticates with.
              # Written here rather than in the probe so the probe carries no
              # credential of its own and no secret ever reaches a probe command
              # line, where `kubectl describe pod` would print it.
              cat >"${CONF_DIR}/client-admin.properties" <<PROPERTIES
              security.protocol=SASL_SSL
              sasl.mechanism=SCRAM-SHA-512
              ssl.truststore.location=/etc/kafka/tls/truststore.jks
              ssl.truststore.password=${KAFKA_TLS_TRUSTSTORE_PASSWORD}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_ADMIN_USER}" password="${KAFKA_SASL_ADMIN_SECRET}";
              PROPERTIES

              # The address that probe must dial, written for it rather than
              # rebuilt in the probe command. It is the POD'S OWN FQDN and not
              # localhost, because ssl.endpoint.identification.algorithm above is
              # https: a probe pointed at localhost would fail certificate
              # hostname verification against a keystore issued for the pod's
              # DNS name, and the pod would never become Ready for a reason that
              # has nothing to do with the broker being healthy.
              printf '%s\n' "${POD_FQDN}:9092" >"${CONF_DIR}/bootstrap-address"

              # THE FORMAT. --add-scram seeds the administrative SCRAM credential
              # into the metadata log as it is created, which is the whole reason
              # this container exists, and --ignore-formatted is what makes
              # running it on every pod start safe.
              #
              # IDEMPOTENCY IS --ignore-formatted, not a guard around it. On an
              # already-formatted volume the CLI prints "All of the log
              # directories are already formatted" and EXITS 0 — verified against
              # apache/kafka 3.9.2 — so a restarted pod re-runs this and
              # continues, rather than crash-looping the way a bare `format`
              # would. The credential is already in that log, so there is nothing
              # to re-seed.
              #
              # THE CLUSTER ID COMES FROM THE ConfigMap AND IS VALIDATED HERE.
              #
              # It is not generated per pod: `kafka-storage random-uuid` run in
              # this container would give each broker its own cluster, the quorum
              # would never form, and each would report the others as unknown. One
              # value on blnk-config reaches all three pods, which is the only
              # arrangement in which they can agree.
              #
              # AND IT IS VALIDATED BEFORE THE FORMAT, because this is the one step
              # in the whole deployment that cannot be corrected afterwards: the ID
              # is written into meta.properties, a broker refuses a log whose ID
              # disagrees with its configuration, and fixing a bad one means
              # destroying the volume. A Kafka cluster ID is the base64url encoding
              # of a 16-byte UUID — exactly 22 characters from [A-Za-z0-9_-], which
              # is what `kafka-storage random-uuid` emits and what Uuid.fromString
              # accepts, rejecting anything longer than 22 outright.
              #
              # apache/kafka 3.9's format tool does NOT check this: it writes
              # whatever string it is given straight into meta.properties and the
              # broker starts on it. That leniency is the trap rather than a
              # reprieve — a value that is not a real UUID works until something
              # parses it as one, and the first candidate is a Kafka upgrade, at
              # which point the volume is already formatted with it. So the shape
              # is enforced here, on a value that has not been committed to disk
              # yet, rather than trusted.
              if [ -z "${KAFKA_CLUSTER_ID:-}" ]; then
                echo "kafka-bootstrap: KAFKA_CLUSTER_ID is empty. It is required, and there is" >&2
                echo "kafka-bootstrap: deliberately no built-in fallback: a default would format" >&2
                echo "kafka-bootstrap: this volume with an ID nobody chose, and every Blnk" >&2
                echo "kafka-bootstrap: deployment that also forgot it would share that ID — which" >&2
                echo "kafka-bootstrap: defeats the one check Kafka does make, a broker refusing to" >&2
                echo "kafka-bootstrap: join a cluster whose ID is not its own." >&2
                echo "kafka-bootstrap: Fix: set KAFKA_CLUSTER_ID on the blnk-config ConfigMap to" >&2
                echo "kafka-bootstrap: the output of 'kafka-storage.sh random-uuid', the same value" >&2
                echo "kafka-bootstrap: for all three brokers, before the first apply." >&2
                exit 1
              fi

              case "${KAFKA_CLUSTER_ID}" in
                *[!A-Za-z0-9_-]*)
                  echo "kafka-bootstrap: KAFKA_CLUSTER_ID contains a character outside the" >&2
                  echo "kafka-bootstrap: base64url alphabet [A-Za-z0-9_-]. A cluster ID is the" >&2
                  echo "kafka-bootstrap: base64url encoding of a 16-byte UUID, so no other" >&2
                  echo "kafka-bootstrap: character can appear in one." >&2
                  echo "kafka-bootstrap: Fix: use the output of 'kafka-storage.sh random-uuid'." >&2
                  echo "kafka-bootstrap: No storage has been touched." >&2
                  exit 1
                  ;;
              esac

              if [ "${#KAFKA_CLUSTER_ID}" -ne 22 ]; then
                echo "kafka-bootstrap: KAFKA_CLUSTER_ID is ${#KAFKA_CLUSTER_ID} characters; a" >&2
                echo "kafka-bootstrap: cluster ID is exactly 22 — the base64url encoding of a" >&2
                echo "kafka-bootstrap: 16-byte UUID. Kafka's Uuid.fromString rejects anything" >&2
                echo "kafka-bootstrap: longer, so a value of another length is not a cluster ID" >&2
                echo "kafka-bootstrap: even where the format tool accepts it." >&2
                echo "kafka-bootstrap: Fix: use the output of 'kafka-storage.sh random-uuid'," >&2
                echo "kafka-bootstrap: the SAME value for every replica — a per-pod id gives each" >&2
                echo "kafka-bootstrap: broker its own cluster and the quorum never forms." >&2
                echo "kafka-bootstrap: No storage has been touched." >&2
                exit 1
              fi
              #
              # IT IS NOT A FREE-TEXT LABEL. A Kafka cluster id is a base64url-encoded
              # 16-BYTE UUID — `kafka-storage.sh random-uuid` prints exactly 22
              # characters, and org.apache.kafka.common.Uuid.fromString refuses
              # anything longer than that or anything that does not decode to exactly
              # 16 bytes. The default here used to read "blnkProductionKRaftCluster":
              # 26 characters, decoding to 19 bytes, and not a valid cluster id under
              # that rule.
              #
              # BE PRECISE ABOUT WHAT IT COST, because the failure is latent rather
              # than immediate and that is what let it survive. `kafka-storage format`
              # on 3.9 and on 4.0 stores --cluster-id VERBATIM in meta.properties and
              # does not parse it, so the format succeeds and a broker started against
              # it comes up — verified against apache/kafka 3.9.2 and 4.0.0. The value
              # is nonetheless permanently wrong: it is written into the metadata log
              # as the cluster's identity, every tool and client that turns a cluster
              # id back into a Uuid rejects it, and correcting it later means
              # destroying every volume in the StatefulSet and re-formatting. So the
              # cost is not a crash on day one; it is an unusable identity discovered
              # by whichever tool parses it first, at which point the cheap fix has
              # expired.
              #
              # THERE IS NO DEFAULT, and that is the decision rather than an omission.
              # A built-in fallback formats this volume with an id nobody chose, and
              # every deployment that also forgot to set one would share it — which
              # defeats the single check Kafka does make, a broker refusing to join a
              # cluster whose id is not its own. The value is required, the refusal
              # above names 'kafka-storage.sh random-uuid' as the way to mint one, and
              # it is minted ONCE for the whole cluster.
              #
              # It is copied into CLUSTER_ID rather than read directly so the checks
              # below read one settled value, and it is CHECKED rather than trusted,
              # because an operator's KAFKA_CLUSTER_ID is the value most likely to be a
              # hand-written label.
              CLUSTER_ID="${KAFKA_CLUSTER_ID}"

              # THE VALIDATION, in the three steps the encoding requires. base64 from
              # coreutils is the only tool used, so nothing is added to the image.
              #
              #   1. LENGTH. Uuid.fromString refuses more than 22 characters outright,
              #      before it decodes anything, so that is checked first and reported
              #      as its own rule.
              #   2. ALPHABET AND CANONICAL FORM. A cluster id is base64URL, whose
              #      62nd and 63rd characters are '-' and '_' where standard base64
              #      uses '+' and '/'. They are translated, the value is padded to the
              #      multiple of four a decoder expects, and the decode either
              #      succeeds or the value was never a base64url string. coreutils
              #      additionally rejects a final group whose unused low bits are not
              #      zero, which makes this check STRICTER than Java's decoder — and
              #      deliberately so: every id kafka-storage mints encodes exactly 16
              #      bytes and is therefore canonical, so the only values this
              #      additional strictness rejects are hand-written labels, which is
              #      the class of mistake being guarded against.
              #   3. DECODED LENGTH. Sixteen bytes, exactly, because the id IS a UUID.
              CLUSTER_ID_PADDED="$(printf '%s' "${CLUSTER_ID}" | tr -- '-_' '+/')"
              case $(( ${#CLUSTER_ID_PADDED} % 4 )) in
                2) CLUSTER_ID_PADDED="${CLUSTER_ID_PADDED}==" ;;
                3) CLUSTER_ID_PADDED="${CLUSTER_ID_PADDED}=" ;;
              esac

              if [ "${#CLUSTER_ID}" -gt 22 ]; then
                echo "kafka-bootstrap: KAFKA_CLUSTER_ID is ${#CLUSTER_ID} characters. Kafka refuses" >&2
                echo "kafka-bootstrap: anything longer than 22: a cluster id is a base64url-encoded" >&2
                echo "kafka-bootstrap: 16-byte UUID, not a label." >&2
                echo "kafka-bootstrap: 'kafka-storage.sh random-uuid' prints a valid one. Use ONE" >&2
                echo "kafka-bootstrap: value for every replica — a per-pod id gives each broker its" >&2
                echo "kafka-bootstrap: own cluster and the quorum never forms." >&2
                exit 1
              fi

              if ! CLUSTER_ID_DECODED="$(printf '%s' "${CLUSTER_ID_PADDED}" | base64 -d 2>/dev/null | wc -c)"; then
                CLUSTER_ID_DECODED="-1"
              fi
              CLUSTER_ID_DECODED="$(printf '%s' "${CLUSTER_ID_DECODED}" | tr -d ' ')"

              if [ "${CLUSTER_ID_DECODED}" != "16" ]; then
                echo "kafka-bootstrap: KAFKA_CLUSTER_ID is not a base64url-encoded 16-byte UUID:" >&2
                echo "kafka-bootstrap: it decodes to ${CLUSTER_ID_DECODED} bytes (a value of -1 means it is not" >&2
                echo "kafka-bootstrap: decodable base64url at all). Kafka requires exactly 16." >&2
                echo "kafka-bootstrap: Refusing to format. 'kafka-storage format' would ACCEPT this" >&2
                echo "kafka-bootstrap: value and write it verbatim into the metadata log, where it" >&2
                echo "kafka-bootstrap: becomes the cluster's permanent identity and can only be" >&2
                echo "kafka-bootstrap: corrected by destroying every volume and re-formatting." >&2
                echo "kafka-bootstrap: 'kafka-storage.sh random-uuid' prints a valid one. Use ONE" >&2
                echo "kafka-bootstrap: value for every replica." >&2
                exit 1
              fi
              unset CLUSTER_ID_PADDED CLUSTER_ID_DECODED

              # A SECOND COPY OF THIS VALIDATION USED TO FOLLOW, re-deriving CLUSTER_ID
              # with a fallback of its own and repeating the alphabet and length checks
              # against it. It is gone. Two derivations of one value is how a fallback
              # survives the removal of the fallback above it: the refusals at the top of
              # this script would run, pass, and then be overwritten by a default nobody
              # was looking at. One derivation, checked once, is the property that makes
              # 'there is no built-in cluster id' true rather than merely stated.

              ARGS="$(mktemp "${CONF_DIR}/add-scram.XXXXXX")"
              printf '%s\n' \
                "--add-scram" \
                "SCRAM-SHA-512=[name=${KAFKA_SASL_ADMIN_USER},password=${KAFKA_SASL_ADMIN_SECRET},iterations=4096]" \
                >"${ARGS}"

              if /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id "${KAFKA_CLUSTER_ID}" \
                  --config "${CONF_DIR}/server.properties" \
                  --ignore-formatted \
                  "@${ARGS}"; then
                rm -f "${ARGS}"
              else
                rm -f "${ARGS}"
                echo "kafka-bootstrap: 'kafka-storage format' failed; its own output above" >&2
                echo "kafka-bootstrap: names the cause. The three usual ones: a cluster-id that" >&2
                echo "kafka-bootstrap: disagrees with an already-formatted volume, a rejected" >&2
                echo "kafka-bootstrap: configuration value, and a log directory the container" >&2
                echo "kafka-bootstrap: cannot write." >&2
                exit 1
              fi
          env:
            - name: TZ
              value: Etc/UTC
            # The pod's own name, which is what makes one manifest serve three
            # brokers: the ordinal suffix becomes node.id and the full name
            # becomes the advertised host and the probe's bootstrap address.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # A principal name, not a credential, so it comes from the ConfigMap
            # — and from the SAME key Blnk reads, so the principal the broker
            # trusts and the principal Blnk presents cannot drift apart.
            - name: KAFKA_SASL_ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_SASL_ADMIN_USER
            # NEVER a `value:` literal, here or in the broker container. This is
            # the password the metadata log is seeded with and the one Blnk's
            # provisioning path presents; committing it to a manifest would put
            # the cluster's whole authorization state in git history.
            - name: KAFKA_SASL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: admin-secret
            # The three TLS passwords are written into the generated broker
            # configuration, so this container needs them even though it never
            # opens a TLS connection and mounts no keystore.
            - name: KAFKA_TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-tls
                  key: keystore-password
            - name: KAFKA_TLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-tls
                  key: truststore-password
            - name: KAFKA_TLS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-tls
                  key: key-password
            # Read from the ConfigMap so the broker's default partition count and
            # the count event_admin.go's EnsureTopics requests are one number.
            - name: KAFKA_MIN_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_MIN_PARTITIONS
            # The external addresses cannot be known until the LoadBalancers
            # exist, so that key is absent from blnk-config.yaml and the listener
            # is omitted until it is supplied.
            #
            # The cluster ID is REQUIRED — blnk-config.yaml declares it empty with
            # the command that produces one — and `optional: true` is still the
            # right marker for both. It is what decides WHERE a missing value is
            # reported: with `optional: false` Kubernetes refuses to create the
            # container at all and the pod sits in CreateContainerConfigError,
            # naming a ConfigMap key and nothing else. Optional lets the container
            # start and lets the validation above refuse, which is the message that
            # says what a cluster ID is, why it cannot be defaulted, and the exact
            # command to generate one.
            - name: KAFKA_EXTERNAL_ADVERTISED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_EXTERNAL_ADVERTISED_HOSTS
                  optional: true
            - name: KAFKA_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_CLUSTER_ID
                  optional: true
          # The same tag the broker container runs, and it must stay that way:
          # this container formats the log the next one reads, and a format
          # written at one metadata.version and opened by a different release is
          # how a broker refuses its own storage.
          image: apache/kafka:3.9.2
          name: kafka-bootstrap
          # This container writes in exactly three places, and all three are volumes:
          # the log directory it formats, the generated configuration, and the CLI's
          # own log4j output. Nothing needs the image's root filesystem, so it is
          # read-only — which also means the argument file carrying the SCRAM password
          # cannot be written anywhere except the memory-backed config volume.
          #
          # Verified against apache/kafka:3.9.2: `kafka-storage.sh format --add-scram`
          # completes as uid 1000 with the root filesystem read-only and these three
          # paths mounted, writing meta.properties and failing to write anywhere else.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Small and short-lived: it formats a log directory and writes three files.
          # A request is still required — without one the POD is BestEffort, because a
          # pod's QoS class is computed across all its containers including init ones,
          # so an unbounded init container would make the broker evictable no matter
          # what the broker container asked for.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # THE SAME CLAIM AND THE SAME PATH AS THE BROKER, which is the whole
            # point: format anything else and the broker opens an unformatted
            # directory with no SCRAM credential in it.
            #
            # AND THAT PATH IS THE CLAIM ROOT, deliberately. Relocating it into
            # a subdirectory would not be a cosmetic change. The first released
            # version of this manifest mounted the claim root, so an already
            # installed cluster keeps its KRaft metadata log, its bootstrap
            # SCRAM credential and its ACL bindings there.
            #
            # Mounting a subdirectory instead shows this container an EMPTY
            # directory, which it would then format into a brand-new cluster
            # with a new cluster id, while every existing principal, ACL and
            # retained message sat unreachable at the root. Never change this
            # path without a verified one-time data migration, and never format
            # a directory other than the one the installed cluster already
            # occupies.
            - mountPath: /var/lib/kafka/data
              name: kafka-data
            - mountPath: /tmp/blnk-kafka
              name: kafka-config
            # The Kafka CLI writes log4j output to $base_dir/logs — /opt/kafka/logs,
            # inside the image — and kafka-run-class.sh mkdir -p's it. Under a
            # read-only root that write fails, so the directory is a volume. Separate
            # from the broker's own log volume because an init container's volume
            # mounts are its own.
            - mountPath: /opt/kafka/logs
              name: kafka-bootstrap-logs
      containers:
        - command:
            - /bin/bash
            - -c
            # The broker starts the configuration the init container generated and
            # formatted storage against. It regenerates nothing: one file means
            # node.id, log.dirs and the cluster the storage was formatted for
            # cannot disagree between the format and the process that opens it.
            #
            # NO CREDENTIAL IS IN THIS CONTAINER'S ENVIRONMENT, deliberately. The
            # JAAS logins the broker needs are already inside the generated
            # configuration, so injecting KAFKA_SASL_ADMIN_SECRET here as well
            # would add a second copy — readable by anyone who can `kubectl exec`
            # into the most network-exposed process in the deployment — and buy
            # nothing. The reference stays where it is used, in the init
            # container above.
            - |
              set -euo pipefail

              CONF=/tmp/blnk-kafka/server.properties
              if [ ! -s "${CONF}" ]; then
                echo "kafka: ${CONF} is missing or empty, so the kafka-bootstrap init" >&2
                echo "kafka: container did not complete. Starting a broker now would either" >&2
                echo "kafka: fail on an unformatted log directory or come up with no" >&2
                echo "kafka: configuration at all. Check 'kubectl logs -c kafka-bootstrap'." >&2
                exit 1
              fi

              exec /opt/kafka/bin/kafka-server-start.sh "${CONF}"
          env:
            - name: TZ
              value: Etc/UTC
            # PINNED SO THE HEAP AND THE MEMORY LIMIT ARE ONE REVIEWABLE PAIR
            # (PERF-P12). kafka-server-start.sh supplies -Xmx1G -Xms1G when
            # this variable is unset, so leaving it out does not mean "no heap
            # setting" — it means the heap is decided somewhere a reader of
            # this manifest cannot see, while the memory limit is decided
            # here. That is how a limit ends up below a heap, which is an OOM
            # kill under load rather than at start-up: the broker comes up,
            # passes both probes, and dies only once traffic makes it use the
            # heap it was promised.
            #
            # 1 GiB against the 3Gi limit below. -Xms equals -Xmx on purpose: a
            # fixed heap means the JVM claims its full budget up front, so a
            # container that would eventually exceed its limit does so
            # immediately and visibly instead of after hours of growth.
            #
            # RAISE THIS AND THE MEMORY LIMIT TOGETHER, in the same edit, and
            # keep the limit at roughly 1.5x the heap for off-heap use. The
            # page cache needs no allowance here — see the note on resources
            # below.
            - name: KAFKA_HEAP_OPTS
              value: '-Xmx1G -Xms1G'
          # The same floor the compose stack pins, for the same two reasons:
          # "kafka-storage format --add-scram" arrived in Kafka 3.5, and 3.9.2 is
          # the lowest release free of CVE-2026-33558, whose DEBUG-level
          # NetworkClient logging makes SASL credentials, SCRAM salts and salted
          # passwords recoverable from a log file. See .env.example for the full
          # per-advisory floor table, including why no 4.x tag at or below 4.3.0
          # is clean. `latest` is not an option here even though two neighbours in
          # this folder use it: the --add-scram floor is a hard constraint, so the
          # tag has to be readable in the manifest.
          image: apache/kafka:3.9.2
          # LIVENESS is deliberately WEAKER than readiness, and the asymmetry is
          # the point. A liveness probe that authenticated would restart every
          # broker in the cluster the moment a credential was rotated wrongly —
          # turning a configuration mistake into an outage, and a restart loop
          # cannot fix a wrong password. So liveness asks only whether the JVM
          # still holds its port, and an authentication failure shows up as
          # NotReady, which removes the pod from the Service without killing it.
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          name: kafka
          ports:
            - containerPort: 9092
            - containerPort: 9093
            # The subscriber-facing listener, fronted by the three
            # kafka-external-<ordinal> LoadBalancer Services in
            # kafka-service.yaml. Declared unconditionally while the listener
            # itself is opt-in: a containerPort is documentation and has no effect
            # on what the process binds, so declaring it costs nothing and its
            # absence would make the Services look like they front a port the
            # workload never mentions.
            - containerPort: 29092
          # READINESS is an AUTHENTICATED, AUTHORIZED request — the same check the
          # compose healthcheck makes, and for the same reason: a broker that has
          # bound its port but cannot authenticate anyone is not ready, and a
          # plain TCP check would call it ready and let the relay publish into a
          # cluster that rejects every connection. Listing topics exercises the
          # whole path this deployment depends on — TLS handshake, SCRAM
          # handshake, and a StandardAuthorizer decision for a super.user — so
          # breaking the credential, the keystore or the authorizer all show up
          # here as NotReady rather than as a silently useless broker.
          #
          # Both arguments are read from files the init container wrote, so no
          # credential and no hostname is inlined in a command `kubectl describe
          # pod` prints. periodSeconds and timeoutSeconds are longer than the
          # postgres precedent because this starts a JVM: pg_isready answers in
          # milliseconds, kafka-topics.sh needs seconds before it has even
          # connected.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >-
                  /opt/kafka/bin/kafka-topics.sh
                  --bootstrap-server "$(cat /tmp/blnk-kafka/bootstrap-address)"
                  --command-config /tmp/blnk-kafka/client-admin.properties
                  --list >/dev/null 2>&1
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 6
          # CONTAINER-LEVEL HARDENING, on top of the pod securityContext above.
          #
          # The pod block establishes WHO the process is; this establishes what it
          # may acquire. Neither existed before, so a compromise inside the broker —
          # the most network-exposed process in this deployment after the API — could
          # escalate through a setuid binary and had the full default capability set
          # to work with.
          #
          # readOnlyRootFilesystem IS set, and the objection it used to carry is answered
          # by the volume list rather than by argument: a Kafka broker writes its own
          # log4j output under the image's install tree, and /opt/kafka/logs is mounted
          # for exactly that. Every path this process writes — the data mount, the
          # memory-backed config emptyDir and the log volume — is explicit, so a
          # read-only root removes the write surface without removing the workload.
          #
          # Verified against apache/kafka:3.9.2 under exactly this posture: the broker
          # runs as uid 1000 with the root filesystem read-only, applies the heap below,
          # answers an admin request, logs no permission error, and writes its log4j
          # output into the mounted volume.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              # A broker binds 9092 and 9093, both above 1024, so it needs no
              # capability at all — not even NET_BIND_SERVICE.
              drop:
                - ALL
          # SET RATHER THAN `{}`, because unset is not neutral for this workload.
          #
          # The previous `resources: {}` was justified by the rest of the folder
          # doing the same and by heap budgets being environment-specific. Both are
          # true and neither survives contact with what unset actually means: a pod
          # with no requests lands in the BestEffort QoS class, which is the FIRST
          # thing the kubelet evicts under node memory pressure. Three brokers with
          # replication factor 3 and min.insync.replicas=2 can lose their entire
          # cluster to one busy node — and the eviction is not a Kafka failure, so
          # nothing in the broker logs explains it.
          #
          # These are a deliberately modest floor for a small production cluster, not
          # a recommendation for a large one. The memory REQUEST is what buys the
          # Burstable class and eviction protection; the LIMIT is set above the JVM
          # heap on purpose, because a limit at or below the heap is an OOM kill that
          # only happens under load — a broker that fails exactly when it matters.
          # Leave headroom above -Xmx for the JVM's own non-heap memory and for the
          # page cache the broker depends on for read throughput.
          #
          # Size these per environment against message volume, retention and node
          # size. Raising them is expected; removing them returns the cluster to
          # BestEffort and reintroduces the eviction exposure.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Formatting and quorum formation happen before readiness, and on a cold
          # cluster the first broker waits for peers that are still being
          # scheduled. Without this, a slow node fails liveness mid-bootstrap and
          # the pod is killed and restarted for being slow rather than broken.
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            # The claim root, matching kafka-bootstrap above and the path the
            # first released version of this manifest installed. See that
            # container's note: relocating this into a subdirectory would open
            # an unformatted directory and abandon the installed cluster's data.
            - mountPath: /var/lib/kafka/data
              name: kafka-data
            # Read-only: the broker reads its keystore and truststore and must
            # never write them.
            - mountPath: /etc/kafka/tls
              name: kafka-tls
              readOnly: true
            - mountPath: /tmp/blnk-kafka
              name: kafka-config
            # The broker's log4j output — server.log, controller.log,
            # kafka-authorizer.log, kafka-request.log — which kafka-run-class.sh writes
            # to /opt/kafka/logs inside the image. A volume because the root filesystem
            # is read-only, and default-medium rather than Memory because these are
            # diagnostics rather than credentials and should not be charged against the
            # broker's memory limit. kafka-authorizer.log in particular is the record of
            # every StandardAuthorizer denial, which is what a subscriber-isolation
            # investigation reads.
            - mountPath: /opt/kafka/logs
              name: kafka-logs
      restartPolicy: Always
      volumes:
        # The generated broker configuration and the probe's client properties,
        # handed from the init container to the broker. Memory-backed so the
        # three JAAS logins written into them never touch a disk: an emptyDir on
        # the default medium is a directory on the node's filesystem, and a
        # credential written there outlives the container in whatever the node
        # does with that filesystem afterwards. An emptyDir also lives for the
        # POD's lifetime rather than the container's, so a broker that restarts
        # without its pod being replaced still finds the configuration the init
        # container wrote.
        - name: kafka-config
          emptyDir:
            medium: Memory
        # Log4j output for the broker and, separately, for the bootstrap CLI. Two
        # volumes rather than one because an init container's mounts are its own, and
        # sharing would have the formatter and the broker rotating the same files.
        - name: kafka-logs
          emptyDir: {}
        - name: kafka-bootstrap-logs
          emptyDir: {}
        - name: kafka-tls
          secret:
            secretName: kafka-tls
            # 0440, NOT 0400, and the distinction is the difference between a
            # broker that starts and one that does not.
            #
            # Secret volume files are owned by root, not by the container's user.
            # 0400 is therefore readable ONLY BY ROOT, and this pod runs as uid
            # 1000 — so the broker could not open its own keystore and failed at
            # start-up with a permission error on a file the manifest had gone out
            # of its way to protect. The comment here previously described 0400 as
            # "private to the container's user", which was the mistake: it is
            # private FROM the container's user.
            #
            # fsGroup: 1000 in the pod securityContext sets GROUP ownership of
            # these files to 1000 and adds that group to the container's
            # supplementary groups. The group read bit in 0440 is what the broker
            # then reads through. The result is exactly as private as 0400 was
            # intended to be — no other pod shares this fsGroup, and the world bits
            # are still clear — while actually being readable by the one process
            # that needs it.
            defaultMode: 0440
  # PER-POD storage, and this template is the ONLY declaration of the broker's
  # storage shape. There is no standalone PersistentVolumeClaim for Kafka, which is
  # deliberate and worth stating because a reader coming from the postgres manifests
  # will look for one: pg-data-persistentvolumeclaim.yaml exists beside
  # postgres-statefulset.yaml, and an equivalent kafka-data claim used to exist here.
  #
  # It was removed because it could not be used and cost money to exist. A
  # PersistentVolumeClaim is ONE claim bound to ONE volume, and ReadWriteOnce means
  # one node may mount it at a time. Kafka runs three replicas here, and each broker
  # needs its OWN KRaft metadata log and its own partition segments — three brokers
  # sharing one claim would either fail to schedule onto separate nodes or, far
  # worse, write concurrently into one log directory, which corrupts the metadata log
  # rather than reporting an error. So nothing ever mounted it, and applying the
  # folder simply provisioned an idle 10Gi volume that an operator would eventually
  # find and have to reason about.
  #
  # A volumeClaimTemplate is the only construct that gives each ordinal a volume of
  # its own. Kubernetes materialises one claim per pod — kafka-data-kafka-0,
  # kafka-data-kafka-1 and kafka-data-kafka-2 — and re-binds each to the same pod
  # across restarts and rescheduling. That last property is what makes the KRaft log
  # durable: a broker that came back with an empty volume would have lost its
  # metadata and its share of every partition.
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          io.kompose.service: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Matches kafka-data-persistentvolumeclaim.yaml. Size this for the
            # retention window: the four category topics — blnk.transactions,
            # blnk.balances, blnk.identities and blnk.system — and their four
            # dead-letter siblings, at six partitions each, times the segment
            # retention the cluster is configured for.
            storage: 10Gi
---
# THE QUORUM BUDGET (F-22).
#
# Without this object, nothing stops a voluntary disruption from taking more than
# one broker at a time. `kubectl drain` on two nodes in succession, a cluster
# autoscaler consolidating capacity, or a node-image rollout will evict every pod it
# is allowed to — and "allowed to" with no PodDisruptionBudget means all of them.
#
# What that costs here is not a slow start-up, it is the cluster. There are three
# KRaft controller voters, so a majority is two; lose two brokers at once and the
# quorum is gone, no metadata can be written, and the relay's publishes fail even
# though every broker process may come back minutes later. Independently,
# min.insync.replicas=2 with replication factor 3 means a producer using
# RequiredAcks=all — which Blnk's publisher does — starts failing as soon as a
# second replica is unavailable. Both thresholds are crossed by the SAME second
# eviction.
#
# maxUnavailable: 1 states that exactly one broker may be voluntarily disrupted at a
# time, which preserves two: a controller majority AND the in-sync replica minimum.
# Expressed as maxUnavailable rather than minAvailable: 2 because the two are
# equivalent at three replicas and only maxUnavailable stays correct if `replicas`
# is later raised — minAvailable: 2 would silently permit three of five to go.
#
# This does NOT restrict involuntary disruption: a node that fails outright takes
# its broker regardless, which is what the required anti-affinity above exists to
# make survivable. The two work together — anti-affinity ensures one node failure is
# one broker, and this ensures one drain is one broker.
#
# Note that an eviction that would breach this budget BLOCKS, so a drain of a node
# hosting a broker waits for the previous broker to become Ready again. That is the
# intended behaviour and it is why terminationGracePeriodSeconds above is generous:
# a rolling node upgrade across three brokers is meant to be slow.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-quorum
  namespace: blnk
  labels:
    io.kompose.service: kafka
spec:
  maxUnavailable: 1
  selector:
    # Must match the StatefulSet's own selector exactly. A PDB whose selector
    # matches nothing is silently inert — it reports zero expected pods and permits
    # every eviction, which looks identical to having no budget at all.
    matchLabels:
      io.kompose.service: kafka
