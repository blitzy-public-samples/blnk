# The broker's storage SHAPE, declared once so nothing else has to restate it.
#
# THIS IS NOT THE STORAGE THE BROKER PODS RUN ON, and reading it that way is the
# mistake this header exists to prevent. A PersistentVolumeClaim is a single
# claim bound to a single volume, and `ReadWriteOnce` below means one node may
# mount it at a time. Kafka runs as a three-replica StatefulSet here
# (kafka-service.yaml documents why, and blnk-config.yaml sets
# KAFKA_REPLICATION_FACTOR to 3 to match), and each broker needs its OWN KRaft
# metadata log and its own partition segments. Three brokers CANNOT share one
# claim: they would either fail to schedule onto separate nodes or, worse,
# write concurrently into one log directory, which corrupts the metadata log
# rather than reporting an error.
#
# Per-broker storage comes from `spec.volumeClaimTemplates` in
# kafka-statefulset.yaml, which is the only construct that gives each ordinal a
# volume of its own. Kubernetes materialises one claim per pod, named
# `kafka-data-kafka-0`, `kafka-data-kafka-1` and `kafka-data-kafka-2`, and
# re-binds each to the same pod across restarts and rescheduling. That last
# property is what makes the KRaft log durable: a broker that came back with an
# empty volume would have lost its metadata and its share of every partition.
#
# WHY THIS FILE EXISTS ANYWAY. It is this folder's Kompose idiom: postgres
# declares its storage BOTH as a volumeClaimTemplate inside
# postgres-statefulset.yaml AND as a standalone pg-data-persistentvolumeclaim.yaml,
# and this file is that same companion declaration for Kafka. Its value is that
# the size and access mode live in ONE reviewable place, so a change to either is
# a change to this file rather than a number buried in a workload manifest.
#
# THE STANZA kafka-statefulset.yaml MUST CARRY, reproduced verbatim so the two
# cannot drift apart. The claim NAME must match this file's `metadata.name`,
# because that is what the broker container's volumeMount refers to:
#
#   volumeClaimTemplates:
#     - metadata:
#         name: kafka-data
#       spec:
#         accessModes: ["ReadWriteOnce"]
#         resources:
#           requests:
#             storage: 10Gi
#
# Following the postgres precedent, the StatefulSet declares no podSpec
# `volumes:` list for this storage — the claim template is the whole mechanism.
# ReadWriteOnce is correct THERE, where it applies per ordinal: each broker
# mounts its own volume exclusively, which is exactly what a KRaft log requires.
#
# WHAT AN OPERATOR SHOULD DO WITH THIS CLAIM. Applying this file provisions a
# 10Gi volume that no workload in this folder mounts, so it stays Bound-and-idle
# and holds storage quota for nothing. In a three-broker deployment, DELETE it
# after the StatefulSet is applied, or do not apply it at all — the claim
# templates create everything the brokers need. Keep and mount it only in a
# deliberately SINGLE-broker deployment, and then also bring
# KAFKA_REPLICATION_FACTOR in blnk-config.yaml down from 3: one broker answers
# CreateTopics with INVALID_REPLICATION_FACTOR for anything higher, so topic
# creation fails outright in event_admin.go's EnsureTopics — after the manifests
# have already applied cleanly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: kafka-data
  name: kafka-data
  namespace: blnk
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
status: {}
