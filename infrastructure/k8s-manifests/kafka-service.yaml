# The Kafka broker's Service surface. It is SEVERAL Services in ONE file by design, and
# they serve three different audiences:
#
#   kafka             the INTERNAL client-facing ClusterIP Service. KAFKA_BROKERS
#                     names it bare as kafka:9092, exactly as data_source.dns
#                     names postgres and redis.dns names redis in
#                     blnk-config.yaml. Blnk's publisher, relay and admin client
#                     dial this and nothing else.
#   kafka-headless    the headless companion kafka-statefulset.yaml points its
#                     serviceName at, which is what gives every broker pod a
#                     stable DNS name of its own.
#   kafka-external-N  one per BROKER, carrying the externally advertised listener
#                     that SUBSCRIBERS connect to. KAFKA_SUBSCRIBER_BROKERS names
#                     these, never the ClusterIP above.
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
  name: kafka
  namespace: blnk
spec:
  # ONLY the SASL client listener, 9092 — the port docker-compose.yaml advertises as
  # BROKER://kafka:9092 and .env.example documents as KAFKA_BROKERS=kafka:9092. Keep
  # this number, the broker's client listener in kafka-statefulset.yaml and that
  # variable in step; a Service pointing at a port the broker does not serve fails like
  # a broken broker, not like a typo.
  ports:
    - name: "9092"
      port: 9092
      targetPort: 9092
  selector:
    io.kompose.service: kafka
status:
  loadBalancer: {}
# --------------------------------------------------------------------------
# WHAT FOLLOWS IS A SECOND SERVICE, not a second copy of the first, and BOTH must be
# deployed:
#
#   * clients — the event publisher, the outbox relay and scripts/kafka-provision.sh —
#     dial the load-balanced `kafka` above;
#   * the brokers themselves cannot. Their advertised listeners and their KRaft
#     controller.quorum.voters have to name one specific pod each, and only a headless
#     Service publishes a per-pod name.
# --------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
  name: kafka-headless
  namespace: blnk
spec:
  # No virtual IP and no load balancing: this name resolves to the broker pod addresses
  # themselves, and each pod additionally answers to
  # kafka-<ordinal>.kafka-headless.blnk.svc.cluster.local.
  clusterIP: None
  # Both listeners, unlike the client-facing Service above: 9092 carries client and
  # inter-broker traffic, 9093 carries the KRaft controller quorum. Being reachable on
  # either by a per-pod name is this Service's whole purpose, so both belong here. These
  # are Kubernetes port names following this folder's Kompose idiom of the quoted port
  # number — they are not Kafka listener names; BROKER and CONTROLLER are configured on
  # the broker itself.
  ports:
    - name: "9092"
      port: 9092
      targetPort: 9092
    - name: "9093"
      port: 9093
      targetPort: 9093
  # Quorum formation happens BEFORE any broker can pass a readiness probe, so the voters
  # must be resolvable before then. Left at its default, DNS omits not-ready pods and a
  # cold start deadlocks: readiness waits on the quorum, the quorum waits on DNS, and
  # DNS waits on readiness. Every Kafka and etcd operator sets this for exactly that
  # reason.
  publishNotReadyAddresses: true
  # Identical to the client Service's selector, and to the StatefulSet's
  # selector.matchLabels: both Services front the same three broker pods and differ only
  # in how they are addressed.
  #
  # THREE PODS MEANS THREE VOLUMES, and it is worth saying here because this is the file
  # that establishes the broker count. Per-pod identity is what makes per-pod STORAGE
  # possible: kafka-statefulset.yaml declares a `volumeClaimTemplates` entry named
  # `kafka-data`, so Kubernetes materialises kafka-data-kafka-0, -1 and -2 and re-binds
  # each to the same ordinal across restarts.
  #
  # THERE IS NO SINGLETON `kafka-data` CLAIM. The volumeClaimTemplates entry is the single
  # definition of a broker volume's shape, and
  # kafka-data-persistentvolumeclaim.yaml holds three OPTIONAL per-ordinal claims as a
  # pre-provisioning convenience that must agree with it. Change the size in one and
  # change it in the other.
  selector:
    io.kompose.service: kafka
status:
  loadBalancer: {}
# --------------------------------------------------------------------------
# THE SUBSCRIBER-FACING LISTENER, ONE SERVICE PER BROKER.
#
# These three Services are what KAFKA_SUBSCRIBER_BROKERS names, and they are the only
# addresses POST /subscribers/{id}/kafka-credentials may hand out. Blnk refuses to issue
# a credential while that variable is empty rather than returning the internal ClusterIP
# name, so this surface is a PREREQUISITE for subscriber onboarding — not an optional
# extra.
# --------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
    blnk.finance/kafka-listener: external
  name: kafka-external-0
  namespace: blnk
spec:
  type: LoadBalancer
  ports:
    - name: "29092"
      port: 29092
      targetPort: 29092
  selector:
    statefulset.kubernetes.io/pod-name: kafka-0
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
    blnk.finance/kafka-listener: external
  name: kafka-external-1
  namespace: blnk
spec:
  type: LoadBalancer
  ports:
    - name: "29092"
      port: 29092
      targetPort: 29092
  selector:
    statefulset.kubernetes.io/pod-name: kafka-1
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: kafka
    blnk.finance/kafka-listener: external
  name: kafka-external-2
  namespace: blnk
spec:
  type: LoadBalancer
  ports:
    - name: "29092"
      port: 29092
      targetPort: 29092
  selector:
    statefulset.kubernetes.io/pod-name: kafka-2
status:
  loadBalancer: {}
