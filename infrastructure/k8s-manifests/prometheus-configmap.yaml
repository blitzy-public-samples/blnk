apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: blnk
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    # This stanza repeats the one in the repository-root prometheus.yml so the
    # Kubernetes and Compose monitoring configurations stay in lockstep, and the
    # path is inside the Prometheus container rather than in the repository.
    # Kubernetes has no bind mounts, so the rule file travels as the
    # blnk-kafka-alerts.yml key below and prometheus-deployment.yaml must project
    # that key into this same directory:
    #   - name: prometheus-config
    #     mountPath: /etc/prometheus/alerts/blnk-kafka-alerts.yml
    #     subPath: blnk-kafka-alerts.yml
    # Keep the key name, the subPath, the mountPath and this path in step. An
    # unmounted rule file is a SILENT failure — the alerts are absent from
    # /api/v1/rules rather than the pod failing to start — so verify there after
    # changing any of the four. The glob matches the root file character for
    # character and resolves for either a per-key subPath mount or a whole-
    # directory projection.
    rule_files:
      - '/etc/prometheus/alerts/*.yml'
    # Both jobs authenticate. This is not optional hardening — it is what makes
    # the alerts above capable of firing at all.
    #
    # Blnk's /metrics endpoint is guarded by MetricsAuthHandler: when
    # server.secure is true it REQUIRES `Authorization: Bearer <token>` and
    # answers everything else with an apierror, and when secure is true with no
    # metrics_bearer_token configured it refuses every request outright. So an
    # unauthenticated scrape against a production deployment collects nothing,
    # every series the rules match on is absent, and the two alerts sit
    # permanently in a state where they cannot fire. That failure is SILENT in
    # the worst way: Prometheus reports the target as down, the rules report no
    # error, and the absence of an alert is indistinguishable from health.
    #
    # credentials_file, never inline `credentials`. Inline would put the token
    # in a ConfigMap, which is stored unencrypted, readable by anything with
    # get-configmap in the namespace, and printed in full by `kubectl describe`
    # — a credential in the one Kubernetes object specifically not intended to
    # hold one. The file form keeps the token in a Secret and leaves only its
    # path here. It also reloads: Prometheus re-reads the file on each scrape,
    # so rotating the Secret takes effect without restarting the pod.
    #
    # The path is a MOUNT CONTRACT with prometheus-deployment.yaml, which
    # projects Secret blnk-metrics-token into this directory. The two must agree
    # exactly, and the failure mode if they do not is loud rather than silent:
    # Prometheus validates that the file exists at config load and refuses to
    # start without it, which is the correct direction — a monitoring stack that
    # cannot authenticate should fail visibly rather than scrape nothing.
    #
    # Create the Secret before applying these manifests:
    #   kubectl -n blnk create secret generic blnk-metrics-token \
    #     --from-literal=metrics-bearer-token="$BLNK_METRICS_BEARER_TOKEN"
    # The value must equal server.metrics_bearer_token in blnk.json (or the
    # BLNK_METRICS_BEARER_TOKEN environment variable) for both the server and
    # the worker, since one token guards both endpoints.
    scrape_configs:
      - job_name: 'blnk-server'
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-bearer-token
        static_configs:
          - targets: ['server:5001']
      - job_name: 'blnk-worker'
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-bearer-token
        static_configs:
          - targets: ['worker:5004']
  # The Kubernetes mirror of alerts/blnk-kafka-alerts.yml, which is the source of
  # truth. A ConfigMap cannot reference a file on disk, so the rules are
  # duplicated here by design; the two copies MUST stay identical in group,
  # interval, expressions, thresholds, dwell times, labels and annotations,
  # because a divergence means one environment alerts and the other does not. The
  # rationale for each threshold and dwell lives in the source file rather than
  # being duplicated here too. Both series are already exposed on the /metrics
  # endpoints the scrape jobs above collect, so no extra target is needed; copy
  # the names rather than retyping them, since one wrong character yields a rule
  # that evaluates against a series nothing records and can never fire.
  blnk-kafka-alerts.yml: |
    groups:
      - name: blnk-kafka-alerts
        interval: 30s
        rules:
          - alert: DeadLetterMessageStuck
            expr: blnk_dlt_oldest_message_age_seconds > 900
            for: 0m
            labels:
              severity: critical
              component: event-streaming
            annotations:
              summary: "Dead-lettered events unresolved for more than 15 minutes"
              description: "The oldest unresolved dead-letter entry destined for {{ $labels.topic }} (instance {{ $labels.instance }}) has been waiting {{ $value | humanizeDuration }}. This value is an age, not a count: one entry this old is enough to fire. REMEDIATION IS STATUS-DEPENDENT, so read the status first with GET /events/dead-letter. A 'dead_lettered' entry is on its topic and is replayable: triage it and replay it with POST /events/dead-letter/:event_id/replay. A 'failed' entry is NOT replayable yet — its retry budget is spent but the dead-letter write itself has not completed, so there may be no message on the topic at all and replay is refused with EVENT_NOT_DEAD_LETTERED; restore broker reachability so the dead-letter write completes, then replay. GET /events/stats reports how many are in each state."
              runbook_url: docs/kafka-operations.md

          - alert: SubscriberConsumerLagHigh
            expr: blnk_kafka_consumer_lag > 10000
            for: 2m
            labels:
              severity: warning
              component: event-streaming
            annotations:
              # The subscriber and group values are OPAQUE registry-issued identifiers
              # ('sub_<uuid>' and 'blnk-grp-<32 hex>') and never customer-chosen names,
              # deliberately: an annotation is rendered into notifications and incident
              # tickets, so a name-derived label would export a customer's identity into
              # places it cannot be recalled from. Resolve the identifier through the
              # subscriber registry when triaging.
              #
              # Three collapse tokens can appear in place of an identifier, each meaning
              # something different: 'unattributed' — the reading came from a query that
              # named no subscriber; 'unregistered' — a value was named but is not one Blnk
              # issued, which is itself worth investigating; 'other' — the topic is not one
              # Blnk owns. See consumerLagSample in event_admin.go.
              summary: "Subscriber consumer group lag is above 10,000 messages"
              description: "Subscriber {{ $labels.subscriber }} (consumer group {{ $labels.group }}) is {{ $value | humanize }} messages behind the end of topic {{ $labels.topic }}. Confirm the consumer is running and keeping up before Kafka's retention window is reached. The subscriber and group labels are PSEUDONYMS, not names: each is a truncated SHA-256 of the identifier, so a metric label never carries a subscriber name into a dashboard or a notification. They are stable, so the same subscriber always produces the same label. Resolve one by listing the registry through GET /subscribers and hashing each subscriber_id the same way, or search the service logs for the matching subscriber_id_hash field."
              runbook_url: docs/kafka-operations.md

          # AUTH-01 — a subscriber credential Blnk could not revoke. Provisioning writes
          # the SCRAM credential BEFORE its ACL bindings, so a binding failure is
          # compensated by revoking it; when that compensation ALSO fails, a live means of
          # authenticating exists for a principal the registry records no issuance for.
          #
          # THE AGE, NOT THE COUNT. A marker cleared within a minute by a retry is
          # routine; one outstanding for an hour means neither automatic settlement path
          # — re-issuing or deprovisioning — has been exercised and a human must revoke.
          - alert: SubscriberRevocationOutstanding
            expr: blnk_subscribers_oldest_revocation_age_seconds > 3600
            # Zero dwell: the gauge IS an age, so the expression already encodes the
            # duration and a `for` would add an hour to an hour.
            for: 0m
            labels:
              severity: critical
              component: event-streaming
            annotations:
              summary: "A subscriber Kafka credential has been awaiting revocation for over an hour"
              description: "Blnk has been unable to revoke a subscriber's SASL/SCRAM credential for {{ $value | humanizeDuration }} (instance {{ $labels.instance }}), so a live credential exists at the broker for a principal no registry row records an issuance for. It is NOT attributed to a subscriber here on purpose — a subscriber label would export a tenant identifier into every notification. Find the rows with GET /subscribers and look for revocation_pending, then revoke by hand with: kafka-configs --alter --delete-config SCRAM-SHA-512 --entity-type users --entity-name <principal>. Re-issuing credentials for the subscriber, or deprovisioning it, settles the marker automatically."
              runbook_url: docs/kafka-operations.md

          # Lag that cannot be measured. Not a lag alert: it fires when Blnk cannot
          # tell what the lag IS, because an unreadable partition contributes zero
          # to a sum and would otherwise RESOLVE SubscriberConsumerLagHigh with a
          # partial total. An incompletely measured topic publishes no lag at all,
          # and this rule covers the gap that leaves.
          - alert: ConsumerLagMeasurementDegraded
            expr: blnk_kafka_consumer_lag_unmeasured_partitions > 0
            # Longer than the lag rule's dwell: a partition is briefly unreadable
            # during ordinary cluster events — a leader election, a broker restart,
            # a reassignment — and paging on those would make this the first rule
            # silenced. Still well inside the dead-letter rule's fifteen minutes.
            for: 5m
            labels:
              severity: warning
              component: event-streaming
            annotations:
              # Warning rather than critical: the events themselves are unaffected
              # and nothing is being lost. What is lost is the ability to SEE a
              # lagging consumer, which needs an operator today, not a page tonight.
              #
              # The subscriber and group values are opaque registry-issued
              # identifiers for the same reason they are on SubscriberConsumerLagHigh.
              summary: "Consumer lag cannot be fully measured for a subscriber topic"
              description: "{{ $value }} partition(s) of topic {{ $labels.topic }} could not be read when subscriber {{ $labels.subscriber }} (consumer group {{ $labels.group }}) was last measured, so its lag is a lower bound and is WITHHELD from blnk_kafka_consumer_lag — SubscriberConsumerLagHigh cannot fire for this topic while this alert holds. Check broker and partition health first; the partial total is in the event-metrics log line. The subscriber and group values are opaque registry identifiers: resolve them through the subscriber registry."
              runbook_url: docs/kafka-operations.md
