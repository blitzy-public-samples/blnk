apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: postgres
  name: postgres
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  serviceName: postgres
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: blnk
            - name: TZ
              value: Etc/UTC
          image: postgres:16
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: postgres
          ports:
            - containerPort: 5432
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pg-data
              subPath: pgdata
      restartPolicy: Always
  volumeClaimTemplates:
    # PERF-C03: SIZED FROM THE MEASURED COST OF blnk.event_outbox, NOT FROM A ROUND NUMBER.
    #
    # This was 10Gi against a shipped event-outbox retention of 90 days, which is a steady
    # state of 8.4 TiB — the two settings were roughly 858x apart, and the volume that loses
    # is the one the LEDGER lives on. A retention period is not a storage policy on its own.
    #
    # THE DERIVATION, from the measurement recorded in sql/1781248800.sql:
    #
    #     measured row cost      2,372 bytes   (heap 2,048 + all 17 indexes 323; no TOAST)
    #     validated throughput     500 events/second   (acceptance criterion V-1)
    #     rows/day              43,200,000
    #     bytes/day                 95.4 GiB
    #     retention                    3 days   (RELAY_EVENT_RETENTION_DAYS in blnk-config.yaml)
    #     bloat/vacuum factor        1.5x       (every row is UPDATEd twice, non-HOT)
    #     ---------------------------------------------------------------------------
    #     event outbox steady state  429 GiB
    #
    # 600Gi is that 429 GiB plus roughly 170 GiB for everything else on this volume: the
    # ledger's own tables and indexes, WAL up to max_wal_size, and the filesystem's reserve.
    #
    # THE LEDGER'S GROWTH IS NOT BOUNDED BY ANY OF THIS, and 170 GiB is an allowance rather
    # than a projection. Transactions and balances are never purged, so their tables grow for
    # the life of the deployment and only YOU can project them from your own transaction rate
    # and history requirements. Do that projection before going to production and add it to
    # this figure. The 429 GiB above is the part this feature is responsible for and the part
    # that has a ceiling.
    #
    # RESCALING, in either direction:
    #
    #   * a different event rate scales linearly — `GiB/day = rate x 86400 x 2372 / 1024^3`;
    #   * each extra retention day is +143 GiB at 500 events/second;
    #   * a deployment running at, say, 20 events/second needs 3.8 GiB/day, so the outbox
    #     share is 17 GiB and this volume is far larger than it has to be. Size it down.
    #
    # Growing it later requires a StorageClass with allowVolumeExpansion: true. Set that up
    # BEFORE you need it: expanding a claim whose class forbids it means a restore, and the
    # moment you need the space is the moment the ledger has stopped accepting writes.
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 600Gi
