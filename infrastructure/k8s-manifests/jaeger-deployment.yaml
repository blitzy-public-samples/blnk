apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: jaeger
  name: jaeger
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jaeger
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: jaeger
    spec:
      containers:
        # PINNED BY VERSION AND DIGEST, AND ON THE v2 IMAGE, NOT v1.
        #
        #   "latest" resolved to jaegertracing/all-in-one:1.76.0, and that image prints
        #   its own end-of-life notice on startup: Jaeger v1 reached end-of-life on
        #   31 December 2025 and receives no further bug fixes or security patches.
        #   Pinning the v1 digest would have frozen a knowingly unpatched image, so the
        #   pin moves to the supported line.
        #
        #   jaegertracing/jaeger is the v2 all-in-one and needs no configuration file for
        #   this use: OTLP ingest on 4317/gRPC and 4318/HTTP and the UI on 16686 are on by
        #   default. COLLECTOR_OTLP_ENABLED is therefore GONE rather than renamed — it was
        #   a v1-only switch that v2 ignores, and leaving it would read as load-bearing
        #   configuration while doing nothing. The container ports and the livenessProbe
        #   below are unchanged and were verified against the v2 image.
        #
        #   Re-pin the tag and the digest together; a tag can be repushed over a
        #   different image, a digest cannot.
        - image: jaegertracing/jaeger:2.20.0@sha256:4a130978c31a30d9baadd9fd902eeb779ed7bf2efd53e8b17bd79069e689da1b
          livenessProbe:
            exec:
              command:
                - wget
                - --spider
                - http://localhost:16686
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          name: jaeger
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          resources: {}
      restartPolicy: Always
status: {}
