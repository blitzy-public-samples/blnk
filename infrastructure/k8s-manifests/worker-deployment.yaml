apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: worker
  name: worker
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: worker
    spec:
      containers:
        - command:
            - blnk
            - workers
            - --config
            - /blnk.json
          env:
            # ---------------------------------------------------------------------
            # Kafka event streaming, outbox relay and webhook deprecation.
            #
            # EVERY KEY IS NAMED EXPLICITLY, and envFrom.configMapRef is NOT used —
            # blnk-config.yaml explains why at length: that ConfigMap also holds the
            # blnk.json document, and envFrom would inject the whole JSON file, data
            # source DSN and password included, into this container's environment,
            # where it surfaces in `env`, in `kubectl describe pod`, in crash dumps
            # and in every child process. Kubernetes permits a dot in a variable
            # name, so it neither skips that key nor warns.
            #
            # WITH KAFKA_BROKERS EMPTY — as blnk-config.yaml ships it — every key
            # below is inert: NewEventPublisher selects the no-op publisher before it
            # reads any of them, and Blnk serves and processes transactions exactly
            # as it did before Kafka existed. Setting KAFKA_BROKERS is what activates
            # them, and blnk-config.yaml lists what must be set in the same change.
            # ---------------------------------------------------------------------
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_BROKERS
            # The subscriber-facing bootstrap list, which is NOT KAFKA_BROKERS: that
            # one is a Service name resolvable only inside this cluster, so
            # reporting it to an external subscriber returns an endpoint it cannot
            # dial. Empty refuses credential issuance with 503 rather than falling
            # back to it. See blnk-config.yaml.
            - name: KAFKA_SUBSCRIBER_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_SUBSCRIBER_BROKERS
            - name: KAFKA_TOPIC_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_TOPIC_PREFIX
            - name: KAFKA_SASL_USER
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_SASL_USER
            - name: KAFKA_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_TLS_ENABLED
            - name: KAFKA_TLS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_TLS_CA_FILE
            - name: KAFKA_MIN_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_MIN_PARTITIONS
            - name: KAFKA_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_REPLICATION_FACTOR
            - name: KAFKA_ALLOW_PARTITION_GROWTH
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_ALLOW_PARTITION_GROWTH
            - name: RELAY_MAX_RETRY_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: RELAY_MAX_RETRY_ATTEMPTS
            - name: RELAY_RETRY_BASE_BACKOFF_MS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: RELAY_RETRY_BASE_BACKOFF_MS
            - name: RELAY_RETRY_MAX_BACKOFF_MS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: RELAY_RETRY_MAX_BACKOFF_MS
            - name: RELAY_EVENT_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: RELAY_EVENT_RETENTION_DAYS
            - name: WEBHOOK_DEPRECATION_SUNSET_DATE
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: WEBHOOK_DEPRECATION_SUNSET_DATE
            # The PRODUCER password. A credential, so it comes from a Secret rather
            # than from the ConfigMap, and it is the only Kafka credential this role
            # needs: publishing requires Write and Describe on the Blnk-owned topics
            # and nothing more.
            #
            # THE OPERATOR PROVISIONS THIS SECRET OUT OF BAND. The reference
            # below expects a Secret named kafka-credentials — resolved in this
            # pod's own namespace, blnk — carrying the key producer-secret,
            # whose value is the SCRAM password of the principal named by
            # KAFKA_SASL_USER above. It must be a DIFFERENT value from that
            # Secret's admin-secret key: config.ProducerSASL declines to let a
            # publisher authenticate as the administrator, so reusing one
            # password is a configuration Blnk refuses to start with rather than
            # merely a weak one.
            #
            # NO SECRET MANIFEST IS COMMITTED TO THIS FOLDER, deliberately — a
            # committed Secret is a credential in version control, and
            # blnk-config.yaml states the same rule. kafka-statefulset.yaml's
            # header lists both Secrets this deployment needs, every key in
            # each, and the kubectl commands that create them.
            - name: KAFKA_SASL_SECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: producer-secret
                  # optional so a deployment that has not adopted Kafka still
                  # starts. A required reference would hold every pod in
                  # CreateContainerConfigError until the Secret existed, which is
                  # both wrong for the shipped state — KAFKA_BROKERS is empty, so
                  # there is nothing to authenticate to — and a worse failure
                  # than the alternative: unset, config/config.go names the
                  # missing variable in the boot log and the construction path
                  # refuses to dial anything half-authenticated.
                  optional: true
            # THREE KAFKA VARIABLES ARE DELIBERATELY ABSENT FROM THIS ROLE and
            # none of them may be added: KAFKA_SASL_ADMIN_USER,
            # KAFKA_SASL_ADMIN_SECRET and KAFKA_ALLOW_ADMIN_PRODUCER.
            # server-deployment.yaml projects all three, so the difference
            # between the two Deployments is a decision rather than drift. It is
            # recorded on this side too, because a manifest is read one workload
            # at a time and an unexplained omission reads as an oversight to
            # whoever is comparing them.
            #
            # THE SERVER ADMINISTERS AND THIS POD DOES NOT. cmd/server.go is the
            # only process that builds a Kafka admin client: topic assurance,
            # subscriber SCRAM provisioning, ACL grants and revocation, and the
            # offset reads behind consumer lag and reconciliation all live
            # there. This pod publishes ledger events and drains asynq queues,
            # so the administrative principal would give it standing authority
            # to create topics, mint credentials and rewrite ACLs that it never
            # exercises — and a compromised worker would carry that authority
            # with it. blnk-config.yaml states the rule at the key itself:
            # supply the administrative pair ON THE SERVER DEPLOYMENT ONLY.
            #
            # PROJECTING THE USERNAME ALONE WOULD BREAK THIS POD, which is why
            # the ConfigMap key is skipped here rather than merely left unused.
            # Its Secret is not delivered to this container, and
            # config/config.go validates the administrative pair AS A PAIR: with
            # KAFKA_BROKERS set, a username without a secret is fatal at
            # configuration load. So the moment an operator filled that
            # ConfigMap key in for the server, every pod of this Deployment
            # would fail to start.
            #
            # KAFKA_ALLOW_ADMIN_PRODUCER is inert here for the same reason. It
            # only chooses BETWEEN credentials, and ProducerSASL reports
            # adminOnly only when an administrative pair is configured; with
            # neither half present this pod publishes as the producer principal
            # above, or without SASL when that pair is empty too.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
          image: jerryenebeli/blnk:0.13.3
          name: worker
          ports:
            - containerPort: 5004
          resources: {}
          volumeMounts:
            - name: blnk-config
              mountPath: /blnk.json
              subPath: blnk.json
            # The certificate authority Blnk verifies the brokers against, at the
            # path KAFKA_TLS_CA_FILE names.
            #
            # ONLY ca.crt is projected, not the whole Secret. kafka-tls also holds the
            # brokers' keystore and its passwords, and this container has no use for
            # either — mounting them would put a private key inside the process most
            # exposed to the network in the deployment.
            #
            # optional: true so a deployment that has not adopted Kafka still starts.
            # With KAFKA_BROKERS empty there is no broker to verify, and a required
            # Secret would hold every pod in ContainerCreating waiting for material
            # nothing reads.
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: blnk-config
          configMap:
            name: blnk-config
        - name: kafka-tls
          secret:
            secretName: kafka-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
