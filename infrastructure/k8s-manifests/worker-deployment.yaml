apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: worker
  name: worker
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worker
  # PINNED RATHER THAN INHERITED. This manifest declared no strategy at all, so it took
  # Kubernetes' default RollingUpdate at 25% / 25% — which at the HPA's minReplicas of 2
  # rounds to one pod unavailable and one surging, and at 10 replicas becomes two and
  # two. Inheriting a percentage means the rollout's concurrency changes silently with
  # the autoscaler's position, and a queue consumer's rollout window is exactly when a
  # burst is least tolerable.
  #
  # maxUnavailable: 1 rather than 0, and the difference from the server is deliberate.
  # The worker serves no requests: it consumes asynq queues, and work not consumed
  # during a rollout waits in Redis rather than failing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: worker
    spec:
      # This pod never calls the Kubernetes API — it talks to Postgres, Redis and
      # TypeSense, and NOT to Kafka: it holds no broker credential and opens no broker
      # connection — and it is the role that processes untrusted transaction payloads
      # off a queue, so a mounted namespace-scoped token is exactly the credential not
      # to leave lying in it.
      automountServiceAccountToken: false
      # RESTRICTED, NON-ROOT EXECUTION. The image declares no USER, so this ran as root.
      # Nothing needs it: the only port bound is 5004, above the privileged range, and
      # the binary is world-executable. fsGroup matches the uid for the same reason it
      # does on the server, and is kept identical between the two roles so a future
      # projection here does not need it rediscovered — this role currently projects no
      # Secret whose mode depends on it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Already exec form, so `blnk` is PID 1 and receives the SIGTERM Kubernetes
        # sends on rollout — which matters here because cmd/workers.go drains the asynq
        # servers on that signal rather than abandoning in-flight tasks. The server
        # container needed an init container to reach the same property; this one did
        # not, and the difference is worth keeping visible.
        - command:
            - blnk
            - workers
            - --config
            - /blnk.json
          env:
            # THE HEAP'S KNOWLEDGE OF ITS OWN CONTAINER. Go's collector sizes the heap
            # against GOGC alone unless told otherwise, so it does not know a cgroup limit
            # exists: it grows until the kernel OOM-kills the container, and the pod
            # restarts mid-backlog with no panic, no log line and nothing on the process to
            # explain it. GOMEMLIMIT makes the limit below a GC target rather than a
            # discovery.
            #
            # 672MiB against a 768Mi limit leaves ~96MiB for everything the Go heap is not:
            # the runtime's own stacks and metadata, the SQL and Kafka drivers' buffers, and
            # the OS pages the binary itself occupies. It is a SOFT limit, so the collector
            # works harder as it is approached rather than failing an allocation — which is
            # the behaviour wanted here, because the alternative to a slower relay is a
            # killed one.
            #
            # Measured before choosing it: draining a 500,000-row backlog holds RSS at a
            # 90MiB plateau with the in-use heap under 21MiB, so this ceiling is roughly
            # five times the observed working set and exists for the pathological case
            # rather than the ordinary one.
            - name: GOMEMLIMIT
              value: 672MiB
            # ---------------------------------------------------------------------
            # AUTHENTICATION AND THE MONITORING SURFACE.
            - name: BLNK_SERVER_SECURE
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: BLNK_SERVER_SECURE
                  optional: true
            # BLNK_METRICS_BEARER_TOKEN is projected further down, from Secret
            # blnk-metrics-token — the SAME Secret prometheus-deployment.yaml mounts, so
            # the value the scraper presents and the value this role verifies cannot
            # drift apart. It is declared ONCE: a second entry for the same variable is
            # not additive, the last one silently wins, and two entries naming different
            # Secrets is how one role starts refusing every scrape while the monitoring
            # stack still reports green. THE MASTER KEY IS DELIBERATELY NOT PROJECTED
            # HERE, and the asymmetry with the server is the point. Nothing in the
            # worker role authenticates an inbound API caller — it has no Gin router and
            # no X-Blnk-Key path — so the key would be an unused credential sitting in
            # the environment of a pod that processes untrusted transaction payloads.
            # ---------------------------------------------------------------------
            - name: BLNK_REDIS_DNS
              valueFrom:
                secretKeyRef:
                  name: blnk-redis
                  key: dns
                  optional: true
            # The worker indexes into TypeSense, so it needs the credential on the same
            # terms as the server: required once secure mode is on and a TypeSense host
            # is configured, because config/config.go refuses to assume the published
            # literal.
            - name: BLNK_TYPESENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: blnk-secrets
                  key: typesense-api-key
                  optional: true
            # ---------------------------------------------------------------------
            # Kafka event streaming, outbox relay and webhook deprecation.
            #
            # What this role reads, each with the code that reads it:
            #
            #   KAFKA_BROKERS                    gates capture —
            #                                    eventPublishingConfigured
            #   KAFKA_TOPIC_PREFIX               names the topic recorded on each
            #                                    captured row
            #   RELAY_MAX_RETRY_ATTEMPTS         stamped on the row AT CAPTURE by
            #                                    event_outbox.go's eventMaxAttempts,
            #                                    so the budget travels with the row
            #                                    rather than being read by the relay
            #   WEBHOOK_DEPRECATION_SUNSET_DATE  ProcessWebhook runs HERE and drops a
            #                                    delivery once the instant has passed
            # ---------------------------------------------------------------------
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_BROKERS
            # WHAT THIS ROLE DOES NOT RECEIVE, AND WHY.
            - name: KAFKA_TOPIC_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: KAFKA_TOPIC_PREFIX
            - name: RELAY_MAX_RETRY_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: RELAY_MAX_RETRY_ATTEMPTS
            - name: WEBHOOK_DEPRECATION_SUNSET_DATE
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: WEBHOOK_DEPRECATION_SUNSET_DATE
            # Log verbosity. Projected because the event pipeline's per-event
            # diagnostics are emitted at DEBUG on purpose — the successful-publish
            # lines, the metrics collector's per-tick summary and the consumer-lag
            # retirement notice — so raising it is how a delivery investigation is done
            # without rebuilding this image. Empty means info, which is what
            # blnk-config.yaml ships.
            - name: BLNK_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: BLNK_LOG_LEVEL
            # THE DATABASE DSN, FROM A SECRET AND NOT FROM THE CONFIGMAP.
            - name: BLNK_DATA_SOURCE_DNS
              valueFrom:
                secretKeyRef:
                  name: blnk-datasource
                  key: dsn
            # NO KAFKA CREDENTIAL OF ANY KIND IS DELIVERED TO THIS ROLE, and none may be
            # added: not KAFKA_SASL_ADMIN_USER, KAFKA_SASL_ADMIN_SECRET or
            # KAFKA_ALLOW_ADMIN_PRODUCER, and — since this pod builds no producer either
            # — not KAFKA_SASL_USER or KAFKA_SASL_SECRET. server-deployment.yaml
            # projects all of them, so the difference between the two Deployments is a
            # decision rather than drift. It is recorded on this side too, because a
            # manifest is read one workload at a time and an unexplained omission reads
            # as an oversight to whoever is comparing them.
            # THE SWITCH THAT MAKES /metrics EXIST ON THIS ROLE, and it is not a
            # verbosity setting. cmd/workers.go registers the monitoring listener's
            # metrics handler only when the OpenTelemetry SDK was set up, and the SDK is
            # set up only when this is true — so with it false there is no /metrics route
            # here at all, every scrape of this pod returns 404, and no series this role
            # records is ever exported.
            #
            # WHAT THAT COSTS, QUANTIFIED, and the asymmetry with the server decides how
            # a DOWN target here should be read: all 16 rules in
            # alerts/blnk-kafka-alerts.yml evaluate series recorded by Blnk, and a rule
            # over a series nothing exports cannot fire and looks exactly like a healthy
            # system. What this variable does NOT do is disarm the event-streaming rules:
            # every one of those 16 rules reads series the SERVER publishes — the relay
            # and its metrics collector run in the server role only, which is why
            # EventMetricsCollectionAbsent is scoped to job="blnk-server" — so they keep
            # evaluating whatever this role does. The cost of leaving it false here is the
            # pre-existing transaction, queue and worker-retry families, which disappear
            # with it, and — because prometheus.yml scrapes this pod as a separate job — a
            # permanently red blnk-worker target beside them that trains an operator to
            # ignore exactly the panel a genuinely absent server target would appear on.
            - name: BLNK_ENABLE_OBSERVABILITY
              valueFrom:
                configMapKeyRef:
                  name: blnk-config
                  key: BLNK_ENABLE_OBSERVABILITY
            # The bearer token that gates /metrics. A credential, so it comes from a
            # Secret rather than the ConfigMap.
            #
            #   umask 077
            #   openssl rand -hex 32 > ./metrics-bearer-token
            #   kubectl -n blnk create secret generic blnk-metrics-token \
            #     --from-file=metrics-bearer-token=./metrics-bearer-token
            #   shred -u ./metrics-bearer-token
            #
            # BY FILE, NOT --from-literal. With a literal the command substitution runs
            # in the shell, so the generated token IS the argument: world-readable in
            # /proc/<pid>/cmdline for the life of the process, and recorded verbatim by
            # shell history and by any audit or CI tooling that logs command lines. That
            # is the same rule prometheus-deployment.yaml and kafka-statefulset.yaml
            # state for their own credentials, and this one authenticates every scrape.
            - name: BLNK_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: blnk-metrics-token
                  key: metrics-bearer-token
                  optional: true
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
          # A PLACEHOLDER THAT IS MEANT TO FAIL UNTIL YOU REPLACE IT, for the reasons
          # server-deployment.yaml sets out at length: jerryenebeli/blnk:0.13.3 is a
          # real published image built before this implementation, so it resolved and
          # the cluster silently ran a worker with no event relay and no Kafka
          # publishing.
          image: blnk:REPLACE_WITH_PINNED_DIGEST
          name: worker
          # ./heartbeat.db is written relative to the working directory when telemetry
          # is enabled, and the image sets no WORKDIR, so it would resolve to "/" —
          # which is read-only here. See server-deployment.yaml.
          workingDir: /var/lib/blnk
          # NAMED, so a probe targets the port by name rather than by number: a named
          # port survives a renumbering and a literal does not, and a probe pointed at a
          # port nothing listens on reports a healthy process as failed.
          ports:
            - name: monitoring
              containerPort: 5004
          # STARTUP, LIVENESS and READINESS. Shorter budgets than the server's
          # throughout, and for one reason: this role runs no migrations. `blnk workers`
          # connects to Redis and Postgres and registers its handlers, so the monitoring
          # listener is up in seconds rather than in however long a schema change takes.
          startupProbe:
            httpGet:
              path: /health
              port: monitoring
            periodSeconds: 5
            failureThreshold: 12
          # Liveness on the port, not on /health, keeping the asymmetry the server and
          # the Kafka broker both use: a restart cannot fix an unreachable dependency,
          # so only a process that has lost its port is restarted.
          livenessProbe:
            httpGet:
              path: /health
              port: monitoring
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # READINESS MEANS SOMETHING DIFFERENT HERE, and it is worth being explicit
          # because it is weaker than it looks. This role is fronted by no user-facing
          # Service — /health on the monitoring listener reports only that the HTTP mux
          # is answering, and it does NOT check Redis or the queues. So this probe
          # cannot report "is this worker consuming tasks".
          readinessProbe:
            httpGet:
              path: /health
              port: monitoring
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # MEASURED REQUESTS AND LIMITS, for the same reason as the server: `resources:
          # {}` made this pod BestEffort — first to be evicted under node pressure — and
          # left worker-hpa.yaml with no denominator for its 70% CPU and 80% memory
          # targets, so the autoscaler reported unknown metrics and never scaled.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # It binds a port above 1024 and calls no privileged syscall, so
              # it needs
              # no capability at all — not even NET_BIND_SERVICE.
              drop:
                - ALL

          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 768Mi
          volumeMounts:
            # NO kafka-tls PROJECTION AND NO KAFKA CREDENTIAL, which is the difference
            # from server-deployment.yaml, which mounts ca.crt at the path its
            # KAFKA_TLS_CA_FILE names.
            #
            # This role opens no broker connection, so it verifies no broker
            # certificate. Removing the projection with the credential keeps the two
            # halves of one decision together: the pod that cannot authenticate to a
            # broker also has nothing to trust one with.
            - name: blnk-config
              mountPath: /blnk.json
              subPath: blnk.json
            - name: blnk-state
              mountPath: /var/lib/blnk
      restartPolicy: Always
      # SIZED AGAINST THIS ROLE'S OWN SHUTDOWN BUDGET(/P11), which is much longer than
      # the server's because asynq's Shutdown WAITS FOR IN-FLIGHT TASKS and the three
      # worker servers are shut down one after another: 5 seconds for the monitoring
      # listener, then up to 30 seconds each for the webhook, hot-pair and transaction
      # servers, then up to 10 more while the service container drains its scheduled
      # cleanups. Worst case is around 105 seconds.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: blnk-config
          configMap:
            name: blnk-config
        # Writable scratch for workingDir, so readOnlyRootFilesystem can stay
        # true.
        - name: blnk-state
          emptyDir: {}
