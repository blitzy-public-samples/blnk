name: recon-agent CI

# M-03: deterministic, exact-acceptance CI for the recon-agent sidecar.
#   * Triggers on the agent's own tree AND on the Blnk HTTP CONTRACT AUTHORITIES it
#     consumes (Rule 5.1), so a change to a consumed route/DTO re-runs this CI.
#   * Environment is scoped PER STEP: BLNK_DATA_SOURCE_DNS/REDIS/TYPESENSE are set
#     only on the Blnk migrate/start steps, never job-globally, so Blnk's
#     config-package file-load unit tests (run by `make test` step 3) are not
#     broken by an inherited DSN.
#   * Gates: zero-warning build/vet (Gate 2), dependency audit + govulncheck +
#     protected-core preservation (Gate 8 / Rule 5.6 / Rule 5.8), image + compose
#     build (C-04), unit coverage >=80% + tagged integration (Gate 9/10), and the
#     end-to-end `make demo` with its <=60s scorer acceptance (Gate 1).
#   * Supply chain: every action is pinned by full commit SHA and every service
#     image by an immutable version tag; both jobs carry an explicit timeout.

on:
  push:
    branches: ["main"]
    paths: &trigger_paths
      - "recon-agent/**"
      - "seed/**"
      - "eval/**"
      - "makefile"
      - "docker-compose.yaml"
      - ".env.example"
      - ".github/workflows/recon-agent.yml"
      # Blnk HTTP contract authorities the agent consumes over the native API
      # (Rule 5.1). A change to any of these can shift a route/DTO the agent
      # mirrors, so it must re-trigger the agent's contract verification.
      - "api/api.go"
      - "api/reconciliation_api.go"
      - "model/reconciliation_model.go"
      - "reconciliation.go"
      - "database/reconciliation.go"
      - "internal/files/files.go"
  pull_request:
    branches: ["main"]
    paths: *trigger_paths

permissions:
  contents: read

concurrency:
  group: recon-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / static / supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so the protected-core diff has a base

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.25.0"

      - name: Zero-warning build + vet — recon-agent module (Gate 2)
        run: |
          cd recon-agent
          go vet ./...
          go build ./...

      - name: Zero-warning build + vet — root module (incl. seed/ + eval/) (Gate 2)
        run: |
          go vet ./...
          go build ./...

      - name: Dependency audit — open-source model binding only (Rule 5.6 / Gate 8)
        run: |
          if grep -REn 'anthropic|openai/openai-go|google\.golang\.org/genai' recon-agent/go.mod recon-agent/go.sum; then
            echo "FAIL: a proprietary/first-party LLM SDK is present in the recon-agent dependency graph (Rule 5.6)"
            exit 1
          fi
          grep -Eq 'github\.com/sashabaranov/go-openai v1\.41\.2($|[^0-9])' recon-agent/go.mod \
            || { echo "FAIL: go-openai is not pinned to the exact required version v1.41.2 (Rule 5.6)"; exit 1; }
          echo "dependency audit OK: no proprietary SDK; go-openai pinned to v1.41.2"

      - name: Protected-core preservation (Rule 5.8)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD || true)"
          else
            changed="$(git show --name-only --pretty=format: HEAD || true)"
          fi
          echo "changed files since base:"; echo "$changed"
          # Repo-root-anchored patterns: Blnk core (reconciliation*/lineage*/
          # transaction*.go, model/), and the root go.mod/go.sum. The agent's own
          # recon-agent/** (including recon-agent/internal/model/ and
          # recon-agent/go.mod) is prefixed and therefore never matches.
          if echo "$changed" | grep -Eq '^(reconciliation[^/]*\.go|lineage[^/]*\.go|transaction[^/]*\.go|model/.*\.go|go\.mod|go\.sum)$'; then
            echo "FAIL: a Rule-5.8-protected Blnk core file or the root module manifest was modified"
            exit 1
          fi
          echo "protected-core preserved: no Blnk core / root manifest change"

      # Vulnerability scanning (M-20 "image vulnerability scanning" clause + Gate 8).
      #
      # Software (Go) layer: govulncheck (Go's first-party scanner from
      # golang.org/x/vuln) scans the compiled binary + the entire module dependency
      # graph against the Go vulnerability database. Kept at @latest deliberately so
      # the freshest advisory set is applied (the vuln DB, not the tool tag, is what
      # gates); the tool is delivered through the pinned Go toolchain, not a
      # third-party Action.
      #
      # OS/image layer: the runtime image's vuln exposure is minimized at the source
      # rather than scanned after the fact — a digest-pinned, actively-supported
      # minimal base (alpine:3.22, replacing EOL 3.20), pinned current OS package
      # versions (ca-certificates/tzdata), a non-root user, and contents limited to
      # the static Go binary + CA certs + tzdata (minimal attack surface). A dedicated
      # container-image scanner Action (e.g. aquasecurity/trivy-action) is
      # INTENTIONALLY NOT wired in: that action suffered a supply-chain compromise in
      # March 2026 (75 of 76 version tags force-pushed to malicious code, SHA-pinning
      # subverted via orphan commits), so importing it would add a known-compromised
      # dependency and defeat the very hardening it purports to provide. Revisit when a
      # vetted, integrity-verified image scanner is available.
      - name: Vulnerability scan — govulncheck (Gate 8 / M-20)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOVULN="$(go env GOPATH)/bin/govulncheck"
          echo "== recon-agent =="; ( cd recon-agent && "$GOVULN" ./... )

      - name: recon-agent image builds (C-04 — fixture packaged; root build context)
        run: docker build -t recon-agent:ci -f recon-agent/Dockerfile .

      - name: docker-compose configuration is valid
        run: docker compose -f docker-compose.yaml config >/dev/null

  test:
    name: test / integration / demo (live Blnk + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16 # major-pinned (never floating :latest)
        env:
          POSTGRES_DB: blnk
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4 # was redis:latest (mutable) — pinned (M-03)
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      typesense:
        image: typesense/typesense:29.0 # version-pinned
        env:
          TYPESENSE_API_KEY: blnk-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
        # No in-container health-cmd: the typesense image ships no curl/bash for a
        # reliable probe. Readiness is polled host-side (runner has curl) in the
        # "Wait for Typesense" step below before Blnk migrate/start.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.25.0"

      - name: Wait for Typesense readiness (host-side)
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8108/health | grep -q '"ok":true'; then
              echo "Typesense is ready"; exit 0
            fi
            sleep 2
          done
          echo "Typesense did not become ready on :8108"; exit 1

      # --- Blnk daemon bring-up (Blnk-only DSNs scoped to these steps) ---
      - name: Migrate Blnk database
        env:
          BLNK_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/blnk?sslmode=disable
          BLNK_REDIS_DNS: localhost:6379
          BLNK_TYPESENSE_DNS: http://localhost:8108
        run: go run ./cmd migrate up

      - name: Start Blnk daemon
        env:
          BLNK_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/blnk?sslmode=disable
          BLNK_REDIS_DNS: localhost:6379
          BLNK_TYPESENSE_DNS: http://localhost:8108
        run: |
          nohup go run ./cmd start > /tmp/blnk.log 2>&1 &
          echo "$!" > /tmp/blnk.pid

      - name: Wait for Blnk readiness (/health => UP)
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:5001/health | grep -q '"status":"UP"'; then
              echo "Blnk is UP"; exit 0
            fi
            sleep 2
          done
          echo "Blnk did not become ready on :5001"; cat /tmp/blnk.log || true; exit 1

      # --- recon-agent seed + gates (recon-agent env only; NO BLNK_DATA_SOURCE_DNS) ---
      - name: Seed internal ledger + 6-break external CSV (via Blnk HTTP)
        env:
          BLNK_BASE_URL: http://localhost:5001
          BLNK_API_KEY: ""
        run: make seed

      - name: make test — unit coverage >=80% + tagged integration + root suite (Gate 9/10)
        env:
          BLNK_BASE_URL: http://localhost:5001
          BLNK_API_KEY: ""
          AGENT_DATABASE_URL: postgres://postgres:password@localhost:5432/blnk?sslmode=disable
          AGENT_TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/blnk?sslmode=disable
          BLNK_TYPESENSE_DNS: http://localhost:8108
          # BLNK_DATA_SOURCE_DNS deliberately UNSET: `make test` step 3 runs the
          # Blnk root suite with `env -u BLNK_DATA_SOURCE_DNS`; setting it here
          # would break Blnk's config-package file-load tests (M-03).
        run: make test

      - name: make demo — end-to-end pipeline + <=60s scorer acceptance (Gate 1)
        env:
          BLNK_BASE_URL: http://localhost:5001
          BLNK_API_KEY: ""
          AGENT_DATABASE_URL: postgres://postgres:password@localhost:5432/blnk?sslmode=disable
        run: make demo

      - name: Blnk daemon log (diagnostics)
        if: always()
        run: cat /tmp/blnk.log || true
